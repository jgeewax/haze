<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haze Status app icon</title>
<style>
/* App icon, rendered to icons/*.png by `python3 build.py --icons`. #maskable keeps the sun inside Android's safe zone. */
html,body{margin:0;width:100vw;height:100vh;overflow:hidden;background:#C9BFA9}
svg{display:block;width:100vw;height:100vh}
</style>
</head>
<body>
<svg viewBox="0 0 512 512" aria-hidden="true">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A9A493"/><stop offset="1" stop-color="#E9DFC9"/></linearGradient>
    <linearGradient id="sun" x1="0" y1="0" x2="0" y2="1"><stop offset=".12" stop-color="#F2742B"/><stop offset="1" stop-color="#F2742B" stop-opacity=".1"/></linearGradient>
  </defs>
  <rect width="512" height="512" fill="url(#sky)"/>
  <g id="grain"></g>
  <circle id="disc" cx="256" cy="248" r="168" fill="url(#sun)"/>
</svg>
<script>
const maskable = location.hash === '#maskable';
if (maskable) { const d = document.getElementById('disc'); d.setAttribute('r', 128); d.setAttribute('cy', 252); }
// a little of the app's haze grain, from a fixed seed so every render is identical
let s = 11; const rnd = () => (s = (s * 16807) % 2147483647) / 2147483647;
let g = '';
for (let i = 0; i < 90; i++) g += `<circle cx="${(rnd() * 512).toFixed(1)}" cy="${(rnd() * 512).toFixed(1)}" r="${(1.5 + rnd() * 3.5).toFixed(1)}" fill="rgba(100,80,55,${(.1 + rnd() * .22).toFixed(2)})"/>`;
document.getElementById('grain').innerHTML = g;
</script>
</body>
</html>
