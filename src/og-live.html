<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Haze Status live link preview</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=Public+Sans:wght@500;600;700;800&display=block">
<style>
/* 1200×630 link preview with live readings, rendered by `python3 build.py --site` for each region.
   Always the light palette: a preview has to look the same in every chat app. */
:root{--ink:#17222B;--muted:#4F5B66;--line:#D9E0E6;--accent:#1D5C88;
  --c0:#479B02;--c1:#006FA1;--c2:#FFCE03;--c3:#FFA800;--c4:#D60000;
  --on0:#FFFFFF;--on1:#FFFFFF;--on2:#1F1A00;--on3:#1F1400;--on4:#FFFFFF;
  --fg0:#3A7F02;--fg1:#006FA1;--fg2:#8A6D00;--fg3:#A86200;--fg4:#C00000;
  --display:'Bricolage Grotesque','Avenir Next',sans-serif;--body:'Public Sans','Helvetica Neue',sans-serif}
*{box-sizing:border-box}
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{font-family:var(--body);color:var(--ink);background:linear-gradient(var(--top),var(--bot))}
.wrap{position:relative;height:100%;padding:44px 56px 40px;display:grid;grid-template-columns:1fr 470px;gap:44px}
.top{display:flex;align-items:center;gap:12px;font-weight:600;font-size:22px}
.top b{font-family:var(--display);font-weight:800;font-size:34px;letter-spacing:-.02em;margin-right:10px}
.top svg{width:36px;height:36px}
.eb{font-size:16px;font-weight:800;letter-spacing:.1em;text-transform:uppercase;opacity:.8}
.word{display:inline-block;font-family:var(--display);font-weight:750;font-size:72px;line-height:1;letter-spacing:-.035em;padding:4px 18px 10px;border-radius:16px;margin:14px 0 10px -6px}
.big{font-family:var(--display);font-weight:700;font-size:96px;line-height:.95;letter-spacing:-.04em}
.big small{font-family:var(--body);font-size:28px;font-weight:600;letter-spacing:0;margin-left:8px}
.lab{font-size:20px;font-weight:600;margin-top:8px}
.url{position:absolute;left:56px;bottom:34px;font-weight:800;font-size:26px;color:var(--accent)}
.card{background:#FFFFFF;border-radius:28px;padding:30px 32px;align-self:center;display:flex;flex-direction:column;gap:12px;box-shadow:0 30px 60px -30px rgba(30,25,15,.45)}
.card .eb{color:var(--muted);opacity:1}
.head{font-family:var(--display);font-weight:700;font-size:32px;line-height:1.1;letter-spacing:-.02em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.pair > div + div{border-left:2px solid var(--line);padding-left:16px}
.pn{font-family:var(--display);font-weight:700;font-size:58px;line-height:1;letter-spacing:-.03em;white-space:nowrap}
.pl{font-size:15px;color:var(--muted);font-weight:600;margin-top:4px}
.bar{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;margin-top:6px}
.bar i{height:14px;border-radius:3px}
.note{font-size:15px;color:var(--muted)}
/* the reading's time, large: a preview saved in a chat is a dated snapshot */
.when{font-family:var(--display);font-weight:700;font-size:40px;letter-spacing:-.02em;margin-top:22px}
</style>
</head>
<body>
<div class="wrap" id="root"></div>
<script>
const DATA = /*DATA*/null;
const PM = [{c:0},{c:2},{c:3},{c:4}];
const LOGO = '<svg viewBox="0 0 28 28" aria-hidden="true" style="width:44px;height:44px"><defs><linearGradient id="sunfade" x1="0" y1="0" x2="0" y2="1"><stop offset=".15" stop-color="#FF8A3D"/><stop offset="1" stop-color="#FF8A3D" stop-opacity=".12"/></linearGradient></defs><circle cx="14" cy="14" r="10" fill="url(#sunfade)"/></svg>';
const d = DATA, root = document.getElementById('root');
document.body.style.setProperty('--top', d.sky.top); document.body.style.setProperty('--bot', d.sky.bot);
const badge = (c, t) => `<span style="display:inline-block;background:var(--c${c});color:var(--on${c});border-radius:8px;padding:2px 10px;font-weight:800;font-size:15px">${t}</span>`;
const fcLine = d.fc ? `${d.fc.when === 'tomorrow' ? 'Tomorrow' : 'Today'} · ${d.fc.day}` : `Today · ${d.day}`;
{
  const r = d.regions[d.target];
  root.innerHTML = `<div style="color:${d.sky.ink}">
      <div class="top">${LOGO}<b>Haze Status</b><span>${r.name}</span></div>
      <div class="when">${d.asOf}</div>
      <div class="eb" style="margin-top:16px">Now · the next hour</div>
      <div class="word" style="background:var(--c${r.pmBand.c});color:var(--on${r.pmBand.c})">${r.pmBand.name}</div>
      <div class="big">${r.pm}<small>µg/m³</small></div>
      <div class="lab">1-hr PM2.5 · Band ${r.pmBand.n}</div>
    </div>
    <div class="card">
      <div class="eb">${fcLine}</div>
      <div class="head" style="color:var(--fg${d.fc ? d.fc.hiC : r.psiBand.c})">${d.fc ? d.fc.name : r.psiBand.name}</div>
      <div class="pair">
        <div><div class="pn" style="color:var(--fg${r.psiBand.c})">${r.psi}</div><div class="pl">24-hr PSI · past 24 hours</div></div>
        <div><div class="pn" style="color:${d.fc ? `var(--fg${d.fc.hiC})` : 'var(--muted)'}">${d.fc ? d.fc.range : 'None'}</div><div class="pl">${d.fc ? `PSI forecast · ${d.fc.when}` : 'No forecast issued'}</div></div>
      </div>
      <div class="bar">${[0,1,2,3,4].map(i => `<i style="background:var(--c${i});opacity:${d.fc ? (i >= d.fc.lo && i <= d.fc.hi ? 1 : .3) : (i === r.psiBand.k ? 1 : .3)}"></i>`).join('')}</div>
    </div>
    <div class="url" style="color:${d.sky.ink}">haze.geewax.org/${d.target}</div>`;
}
</script>
</body>
</html>
