<title>Haze Sky</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column app. A sky-coloured header bar (tinted by today's air) over four tabbed views and a bottom tab bar.
   Phone: full screen. Desktop: the sky fills the window and the app floats as a card. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#12202B; --muted:#5A6A77; --line:#D9E0E6;
  --accent:#1D5C88; --accent-ink:#FFFFFF;
  --c0:#479B02; --c1:#006FA1; --c2:#FFCE03; --c3:#FFA800; --c4:#D60000;           /* NEA official */
  --on0:#FFFFFF; --on1:#FFFFFF; --on2:#1F1A00; --on3:#1F1400; --on4:#FFFFFF;
  --fg0:#3A7F02; --fg1:#006FA1; --fg2:#8A6D00; --fg3:#A86200; --fg4:#C00000;      /* as text on surface */
  --tn0:#DDEFD3; --tn1:#D4E8F4; --tn2:#FFF5C9; --tn3:#FFEBC6; --tn4:#F8D3CE;
  --display:'Bricolage Grotesque','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans','Helvetica Neue','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1116; --surface:#141D25; --surface-2:#1A242D; --ink:#E5ECF1; --muted:#93A3B0; --line:#26333E;
  --accent:#73B6E3; --accent-ink:#0B1116;
  --fg0:#7BC64A; --fg1:#55A9DA; --fg2:#FFCE03; --fg3:#FFA800; --fg4:#FF6152;
  --tn0:#1C2D12; --tn1:#0F2738; --tn2:#363010; --tn3:#3A2A0F; --tn4:#3A1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1116; --surface:#141D25; --surface-2:#1A242D; --ink:#E5ECF1; --muted:#93A3B0; --line:#26333E;
  --accent:#73B6E3; --accent-ink:#0B1116;
  --fg0:#7BC64A; --fg1:#55A9DA; --fg2:#FFCE03; --fg3:#FFA800; --fg4:#FF6152;
  --tn0:#1C2D12; --tn1:#0F2738; --tn2:#363010; --tn3:#3A2A0F; --tn4:#3A1512; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-bot,var(--bg));background-image:linear-gradient(var(--sky-top,var(--bg)),var(--sky-bot,var(--bg)));color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;height:100%;width:100%;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}

/* header bar */
.hdr{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px 18px;background:var(--sky-top);color:var(--sky-ink);position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo svg{width:28px;height:28px;flex:none}
.logo b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1;display:block}
.logo small{display:block;font-size:11.5px;opacity:.75;margin-top:2px;white-space:nowrap}
.logo small i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:7px 10px 7px 9px;font-weight:700;font-size:14px;color:var(--sky-ink);background:var(--sky-chip)}
.chip svg{width:16px;height:16px;flex:none}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:inherit}
.iconbtn svg{width:20px;height:20px}

.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.view[hidden]{display:none}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.4}

/* atoms */
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.eb .sub{font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.75;margin-left:2px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:16px;height:16px}
.foot{font-size:12px;color:var(--muted)}
.ext{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ext svg{width:.95em;height:.95em}
.ext:hover{text-decoration:underline}
.official{font-size:12.5px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.for{font-size:12.5px;opacity:.8}
.for button{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;min-width:34px}

/* Now */
.sky{position:relative;color:var(--sky-ink);background:linear-gradient(var(--sky-top),var(--sky-bot));padding:10px 22px 22px;flex:1.15 0 auto;display:flex;flex-direction:column}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sky > *:not(canvas){position:relative}
.big{font-family:var(--display);font-weight:750;font-size:clamp(44px,13vw,54px);line-height:1;letter-spacing:-.035em;margin:8px 0 8px;align-self:flex-start;padding:.02em .16em .06em;border-radius:.16em;margin-left:-.1em}
.act{font-family:var(--display);font-size:20px;line-height:1.2;font-weight:600;margin:12px 0 4px;text-wrap:balance}
.ahead{flex:1 0 auto;padding:18px 22px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
/* big numbers: people come for them */
.bign{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em}
.bign small{font-family:var(--body);font-size:16px;font-weight:600;letter-spacing:0;margin-left:5px}
.nlab{font-size:12.5px;margin:4px 0 2px;opacity:.88}
.head2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.02em}
.pair{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.pair > div{display:flex;flex-direction:column;gap:3px;min-width:0}
.pair > div + div{padding-left:14px;border-left:1px solid var(--line)}
.pn{font-family:var(--display);font-weight:700;font-size:clamp(32px,10.5vw,44px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.pl{font-size:12px;color:var(--muted)}
/* bars: track by band, pin above, forecast bracket below */
.hb{position:relative;padding-top:32px}
.hb .track{display:grid;gap:3px}
.hb .track i{height:10px;border-radius:2px;display:block}
.hb .pin{position:absolute;top:0;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;pointer-events:none}
.hb .pin b{font-size:13px;font-weight:800;padding:2px 8px;border-radius:7px;background:var(--pin-bg);color:var(--pin-fg);white-space:nowrap}
.hb .pin::after{content:"";width:3px;height:22px;background:var(--pin-bg);border-radius:2px;margin-top:-1px;box-shadow:0 0 0 2px var(--pin-halo)}
.hb .rng{position:relative;height:24px;margin-top:4px}
.hb .rng span{position:absolute;top:0;height:8px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.hb .rng em{position:absolute;top:7px;transform:translateX(-50%);font-style:normal;font-size:11px;font-weight:800;background:var(--surface);padding:0 5px;white-space:nowrap}
.hb .labs{display:grid;gap:3px;font-size:10.5px;font-weight:700;margin-top:4px;line-height:1.15}
/* the share call to action on the Now screen */
.sharebar{display:flex;gap:8px;margin-top:8px}
.wa{flex:1;display:flex;align-items:center;justify-content:center;gap:8px;background:#25D366;color:#062B14;border-radius:14px;padding:13px 14px;font-weight:800;font-size:15.5px;text-decoration:none}
.wa svg{width:20px;height:20px}
.more{width:52px;flex:none;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;display:grid;place-items:center}
.more svg{width:20px;height:20px}
.plan{font-family:var(--display);font-size:19px;line-height:1.25;font-weight:600;margin-top:6px;text-wrap:balance}

/* My day */
.day{padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;flex:1 0 auto}
.day h2{font-family:var(--display);font-size:30px;line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:17px;top:24px;bottom:34px;width:2px;background:var(--line)}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;position:relative}
.mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px var(--surface)}
.mk svg{width:19px;height:19px}
.when{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.when span{text-transform:none;letter-spacing:0;font-weight:600}
.v{font-family:var(--display);font-size:22px;font-weight:650;line-height:1.15;margin:2px 0 3px}
.a{font-size:14.5px;line-height:1.4}
.why{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.news{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:13px 15px;font-size:13.5px;line-height:1.45;text-align:left;color:inherit;width:100%}
.news b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

/* History */
.hist{padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px}
.hist h2,.set h2{font-family:var(--display);font-size:28px;margin:0;letter-spacing:-.02em;line-height:1.1}
.hist .lead{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats > div,.stats > button{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stats .t{font-size:11.5px;color:var(--muted)}
.sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.sec h3 span{text-transform:none;letter-spacing:0;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .bl{font-weight:700;font-size:10px}
.chart .end{fill:var(--ink);font-weight:800;font-size:11.5px}
.chart[data-chart]{touch-action:pan-y;cursor:crosshair;-webkit-tap-highlight-color:transparent}
.ro{display:flex;align-items:center;gap:12px;min-height:46px;margin-bottom:6px}
.ro .rn{font-family:var(--display);font-size:36px;font-weight:700;line-height:1;min-width:2.2ch}
.ro .rd{display:flex;flex-direction:column;gap:3px;font-size:13px}
.ro .rt{font-size:12.5px;color:var(--muted)}
.stats button{font:inherit;color:inherit;text-align:left;cursor:pointer}

/* Settings */
.set{padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px}
.group{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:left}
.opt:first-child{border-top:0}
.opt .nm{font-weight:700;font-size:15px}
.opt .ex{font-size:12.5px;color:var(--muted);grid-column:1}
.opt .side{grid-row:1 / span 2;grid-column:2;display:flex;gap:8px;align-items:center}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--accent)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto;width:100%}
.xt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 6px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.xt .nm{font-weight:700;font-size:15px}
.xt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;background:var(--surface)}
.xt[aria-pressed="true"] .nm::after{content:" ✓";color:var(--accent)}
.x-north{grid-column:2;grid-row:1}.x-west{grid-column:1;grid-row:2}.x-central{grid-column:2;grid-row:2}.x-east{grid-column:3;grid-row:2}.x-south{grid-column:2;grid-row:3}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.locbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}
.locbtn svg{width:20px;height:20px}
.locbtn:disabled{opacity:.6;cursor:progress}
.msg{font-size:13px;color:var(--muted);margin:8px 2px 10px}
.plain{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}

/* sheet (region picker, explainer, NEA statement) */
.scrim{position:absolute;inset:0;background:rgba(5,10,15,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;z-index:6;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 4px 20px}
.sheet h4{font-family:var(--display);font-size:22px;margin:0}
.sheet .sb{overflow-y:auto;padding:6px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sb p{margin:0 0 8px;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > div{border-radius:12px;padding:12px;font-size:13px;line-height:1.4;background:var(--surface-2);border:1px solid var(--line)}
.two b{display:block;font-size:14px;margin-bottom:4px}
.mx{display:flex;flex-direction:column;gap:4px}
.mx .r{border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;display:grid;grid-template-columns:88px 1fr;gap:4px 10px}
.mx .r .h{font-weight:800;font-size:11.5px}
.mx .r .h small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.mx .r.on{box-shadow:0 0 0 2px var(--ink) inset}
/* sharing */
.hdr{gap:4px}
.hdr .iconbtn{width:36px;height:36px}
.hdr .chip{margin-right:2px}
.logo > div{min-width:0}
.logo small{overflow:hidden;text-overflow:ellipsis}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.shbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.shb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;text-align:center;line-height:1.2}
.si{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF}
.si svg{width:24px;height:24px}
.imgbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.imgbtn svg{width:20px;height:20px}
#imgOut{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#imgOut[hidden]{display:none}
#imgOut img{width:100%;max-width:100%;border-radius:14px;border:1px solid var(--line);display:block}
#imgOut a{text-decoration:none;color:var(--ink)}
.qrbox{display:flex;gap:16px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px}
.qrbox svg{flex:none;width:132px;height:132px;border-radius:8px}
.qrbox b{display:block;font-size:15px;margin-bottom:2px}
.qrbox span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.qrbox .u{color:var(--ink);font-weight:700;margin-top:8px;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}

/* Full-bleed at every width: backgrounds run edge to edge, the content column stays at most 600px and centred */
.hdr{padding-left:max(18px,calc(50% - 300px));padding-right:max(10px,calc(50% - 310px))}
.sky,.ahead{padding-left:max(22px,calc(50% - 300px));padding-right:max(22px,calc(50% - 300px))}
.day,.hist,.set{padding-left:max(20px,calc(50% - 300px));padding-right:max(20px,calc(50% - 300px))}
.tabbar{padding-left:max(6px,calc(50% - 300px));padding-right:max(6px,calc(50% - 300px))}
.sheet{margin:0 auto;max-width:640px}
.topnav{display:none}
/* Wide screens: top navigation instead of the tab bar; Now and Today side by side on the sky */
@media (min-width:960px){
  .tabbar{display:none}
  .hdr{padding:14px max(28px,calc(50% - 580px));gap:10px}
  .logo{flex:0 0 auto}
  .topnav{display:flex;gap:4px;margin-right:auto;margin-left:28px}
  .topnav button{border:0;background:transparent;color:var(--sky-ink);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;opacity:.75}
  .topnav button[aria-selected="true"]{opacity:1;background:var(--sky-chip)}
  #v-now{flex-direction:row;align-items:center;gap:48px;background:linear-gradient(var(--sky-top),var(--sky-bot));padding:24px max(28px,calc(50% - 580px)) 40px;overflow-y:auto}
  #v-now .sky{flex:1 1 0;background:none;padding:0;align-self:center;min-width:0}
  #v-now .sky > canvas{display:none}
  #v-now .ahead{flex:0 1 500px;min-width:0;border-radius:28px;padding:28px 30px 24px;box-shadow:0 30px 70px -35px rgba(10,20,30,.55);align-self:center}
  .big{font-size:84px}
  .bign{font-size:92px}
  .bign small{font-size:22px}
  .nlab{font-size:15px;margin-top:8px}
  .act{font-size:28px;max-width:20ch;margin-top:20px}
  .for{font-size:14px}
  .hb .labs{font-size:12px}
  .head2{font-size:30px}
  .pn{font-size:52px}
  .pl{font-size:13.5px}
  .plan{font-size:22px}
  .day,.hist,.set{padding-left:max(28px,calc(50% - 560px));padding-right:max(28px,calc(50% - 560px));padding-top:32px}
  .tl{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .tl::before{display:none}
  .tl .step{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:18px}
  .day h2{font-size:38px}
  .day .news{max-width:760px}
  .hist{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-content:start}
  .hist > :not(.sec){grid-column:1 / -1}
  .set{max-width:none}

<script>/*VENDOR:qrcode*/</script>
<script>
/* ---------- Snapshot of real NEA responses (used only when the live fetch is unavailable) ---------- */
const SNAP_AQ = /*AQ*/null;
const SNAP_ADV = /*ADV*/null;

/* ---------- Reference data (NEA, "How to plan your outdoor activities during haze", June 2026) ---------- */
const REGIONS = ['north','west','central','east','south'];
const RNAME = {north:'North',south:'South',east:'East',west:'West',central:'Central'};
const REX = {north:'Woodlands, Yishun, Sembawang', west:'Jurong, Clementi, Choa Chu Kang', central:'Bishan, Toa Payoh, Ang Mo Kio, Orchard', east:'Tampines, Bedok, Pasir Ris, Punggol', south:'CBD, Bukit Merah, Queenstown, Sentosa'};
const SUBS = [['pm25','ChartPM25'],['pm10','ChartPM10'],['o3','ChartO3'],['co','ChartCO'],['so2','ChartSO2']];
/* who → which column of NEA's guide applies */
const GROUPS = [
  {id:'healthy', name:'Healthy adult', pm:'gen', psi:'healthy', plural:'healthy adults'},
  {id:'child', name:'Child', pm:'vul', psi:'elderly', plural:'children'},
  {id:'pregnant', name:'Pregnant', pm:'vul', psi:'elderly', plural:'pregnant women'},
  {id:'elderly', name:'Elderly', pm:'vul', psi:'elderly', plural:'the elderly'},
  {id:'chronic', name:'Heart or lung condition', pm:'vul', psi:'chronic', plural:'people with heart or lung conditions'}];
const PM = [
  {max:55, n:1, c:0, name:'Normal', range:'0–55', lo:0, hi:55, gen:'Continue with normal activities.', vul:'Continue with normal activities.'},
  {max:150, n:2, c:2, name:'Elevated', range:'56–150', lo:56, hi:150, gen:'Reduce strenuous outdoor activity for the next hour.', vul:'Avoid strenuous outdoor activity for the next hour.'},
  {max:250, n:3, c:3, name:'High', range:'151–250', lo:151, hi:250, gen:'Avoid strenuous outdoor activity for the next hour.', vul:'Avoid all outdoor activity for the next hour.'},
  {max:Infinity, n:4, c:4, name:'Very High', range:'≥251', lo:251, hi:350, gen:'Minimise all outdoor activity for the next hour.', vul:'Avoid all outdoor activity for the next hour.'}];
const PSI = [
  {max:50, c:0, name:'Good', range:'0–50', healthy:'Normal activities.', elderly:'Normal activities.', chronic:'Normal activities.'},
  {max:100, c:1, name:'Moderate', range:'51–100', healthy:'Normal activities.', elderly:'Normal activities.', chronic:'Normal activities.'},
  {max:200, c:2, name:'Unhealthy', range:'101–200', healthy:'Reduce prolonged or strenuous outdoor physical exertion.', elderly:'Minimise prolonged or strenuous outdoor physical exertion.', chronic:'Avoid prolonged or strenuous outdoor physical exertion.'},
  {max:300, c:3, name:'Very Unhealthy', range:'201–300', healthy:'Avoid prolonged or strenuous outdoor physical exertion.', elderly:'Minimise outdoor activity.', chronic:'Avoid outdoor activity.'},
  {max:Infinity, c:4, name:'Hazardous', range:'>300', healthy:'Minimise outdoor activity.', elderly:'Avoid outdoor activity.', chronic:'Avoid outdoor activity.'}];

const ICON = {
  pin:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-7-6.2-7-11.5A7 7 0 0 1 19 9.5C19 14.8 12 21 12 21z"/><circle cx="12" cy="9.5" r="2.5"/></svg>',
  down:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  right:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 6 6 6-6 6"/></svg>',
  info:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 11v5M12 8h.01"/></svg>',
  close:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  locate:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3"/></svg>',
  go:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m5 12.5 4.5 4.5L19 7.5"/></svg>',
  ease:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round"><path d="M6 12h12"/></svg>',
  light:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="12" cy="12" r="7"/><path d="M12 8.5V12l2.5 1.5"/></svg>',
  home:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4.5 11 12 4.5 19.5 11M6.5 9.5V19h11V9.5"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V20h14v-7.5"/></svg>',
  link:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>',
  image:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="2.5"/><circle cx="9" cy="10" r="2"/><path d="m21 16-5-5-9 9"/></svg>',
  chat:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 11.5a8 8 0 0 1-11.7 7.1L4 20l1.3-4.1A8 8 0 1 1 20 11.5z"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11.2l6.3 2.3L11.6 20l3.3-4.4 4.6 3.4L21 4zM9.3 13.5 21 4"/></svg>'
};

/* ---------- Settings, saved in this browser ---------- */
const KEY = 'haze-sky:v2';
const DEFAULTS = {region:'central', group:'healthy', start:'now'};
const P = {...DEFAULTS};
try { const p = JSON.parse(localStorage.getItem(KEY) || '{}');
  if (REGIONS.includes(p.region)) P.region = p.region;
  if (GROUPS.some(g => g.id === p.group)) P.group = p.group;
  if (['now','day'].includes(p.start)) P.start = p.start; } catch(e) {}
/* A shared link like haze.geewax.org/west/ (or the older #west) opens on that region. It becomes the default only for a
   first-time visitor; anyone who already picked a region keeps it saved and just views the linked one for this visit. */
let keepRegion = null;
{ const fromPath = (/^\/(north|south|east|west|central)\/?$/i.exec(location.pathname) || [])[1];
  const linked = (fromPath || (location.hash || '').slice(1)).toLowerCase();
  if (REGIONS.includes(linked)){
    let stored = null; try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if (stored && REGIONS.includes(stored.region) && stored.region !== linked) keepRegion = stored.region;
    P.region = linked;
    try { history.replaceState(null, '', (fromPath ? '/' : location.pathname) + location.search); } catch(e) {}
    if (!stored) try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
  } }
function save(){ try { localStorage.setItem(KEY, JSON.stringify(keepRegion ? {...P, region:keepRegion} : P)); } catch(e) {} }
const S = {tab:P.start, d:null, live:false};
const G = () => GROUPS.find(g => g.id === P.group);

/* ---------- Data: fetched by the browser from NEA, snapshot as fallback ---------- */
async function fetchJSON(url, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal:c.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadLive(){
  const ts = Date.now();   // cache-buster, as haze.gov.sg does
  const [aq, adv] = await Promise.all([
    fetchJSON('https://www.haze.gov.sg/api/airquality/jsondata/' + ts, 7000),
    fetchJSON('https://www.nea.gov.sg/api/advisory/latesthazesituationupdate/' + ts, 7000).catch(() => null)]);
  return normalise(aq, adv);
}
const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseNea(s){
  const m = /(\d+) (\w{3}) (\d{4}) (\d{1,2})(AM|PM)/.exec(s || ''); if (!m) return null;
  let h = (+m[4]) % 12; if (m[5] === 'PM') h += 12;
  return new Date(Date.UTC(+m[3], MON[m[2]], +m[1], h - 8));
}
const sg = d => new Date(d.getTime() + 8*3600e3);
function sgHour(d){ const h = sg(d).getUTCHours(); return (h % 12 || 12) + (h < 12 ? 'am' : 'pm'); }
function sgDay(d, dow){ const x = sg(d); return (dow ? DOW[x.getUTCDay()] + ' ' : '') + x.getUTCDate() + ' ' + Object.keys(MON)[x.getUTCMonth()]; }
const dayNum = d => Math.floor(sg(d).getTime() / 86400e3);
function normalise(aq, adv){
  const times = aq.Chart1HRPM25.North.Data.map(p => parseNea(p.dateTime));
  const regions = {};
  for (const r of REGIONS){
    const K = RNAME[r];
    const pm = aq.Chart1HRPM25[K].Data.map(p => p.value > 0 ? p.value : null);
    const sub = {};
    for (const [k, c] of SUBS) sub[k] = ((aq[c] || {})[K] || {Data:[]}).Data.map(p => p.value > 0 ? p.value : null);
    // 24-hr PSI = the highest pollutant sub-index for that hour
    const psi = times.map((_, i) => { const v = SUBS.map(([k]) => sub[k][i]).filter(x => x != null); return v.length ? Math.max(...v) : null; });
    regions[r] = {pm, psi};
  }
  let li = times.length - 1;
  while (li > 0 && REGIONS.some(r => regions[r].pm[li] == null || regions[r].psi[li] == null)) li--;
  const text = ((adv && adv.AirQualityBlurb) || '').replace(/^[^:]*:\s*/, '').trim();
  const idx = text.split(/\s+to\s+|\s*[–-]\s*/i).map(p => PSI.findIndex(b => b.name.toLowerCase() === p.trim().toLowerCase())).filter(i => i >= 0);
  const issued = adv && adv.DateOfArticle ? new Date(adv.DateOfArticle) : null;
  // NEA's evening forecast covers the next day; a morning one covers the same day
  const fcDate = issued ? new Date(issued.getTime() + (sg(issued).getUTCHours() >= 12 ? 86400e3 : 0)) : null;
  let statement = [];
  if (adv && adv.BodyText){
    const doc = new DOMParser().parseFromString(adv.BodyText, 'text/html');
    statement = [...doc.querySelectorAll('div,p')].filter(el => !el.querySelector('div,p'))
      .map(el => el.textContent.replace(/\s+/g, ' ').trim().replace(/^\d+\.\s*/, '')).filter(t => t.length > 60).slice(0, 4);
  }
  return {times, li, regions, asOf: times[li], issued, statement,
    fc: idx.length && fcDate ? {text, lo: Math.min(...idx), hi: Math.max(...idx), date: fcDate} : null};
}

/* ---------- Derived ---------- */
const pmIdx = v => PM.findIndex(b => v <= b.max);
const psiIdx = v => PSI.findIndex(b => v <= b.max);
function now(r){ const R = S.d.regions[r], i = S.d.li; return {pm:R.pm[i], psi:R.psi[i], b:PM[pmIdx(R.pm[i])], p:PSI[psiIdx(R.psi[i])]}; }
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const badge = (c, t) => `<span class="badge" style="background:var(--c${c});color:var(--on${c})">${esc(t)}</span>`;
const pmAdvice = b => b[G().pm], psiAdvice = b => b[G().psi];
function fcRel(){ const f = S.d.fc; return f ? dayNum(f.date) - dayNum(S.d.asOf) : null; }
function fcWhen(){ const f = S.d.fc, r = fcRel(); return sgDay(f.date, true) + (r === 0 ? ' · today' : r === 1 ? ' · tomorrow' : r < 0 ? ' · out of date' : ''); }
function fcName(){ const f = S.d.fc; return f.lo === f.hi ? PSI[f.lo].name : `${PSI[f.lo].name} to ${PSI[f.hi].name}`; }
function fcBadges(){ const f = S.d.fc; return f.lo === f.hi ? badge(PSI[f.lo].c, PSI[f.lo].name) : badge(PSI[f.lo].c, PSI[f.lo].name) + ' to ' + badge(PSI[f.hi].c, PSI[f.hi].name); }
const forLine = () => `<div class="for">Advice for ${esc(G().plural)} · <button data-tab="set">Change</button></div>`;
function isDark(){ const t = document.documentElement.getAttribute('data-theme'); return t ? t === 'dark' : matchMedia('(prefers-color-scheme: dark)').matches; }
function verdict(t){
  if (/^(Continue|Normal)/.test(t)) return {w:'Normal activities', i:'go', k:0};
  if (/^Reduce/.test(t)) return {w:'Reduce exertion', i:'ease', k:1};
  if (/^(Avoid|Minimise) (prolonged|strenuous)/.test(t)) return {w:'Limit exertion', i:'light', k:2};
  return {w:'Limit time outdoors', i:'home', k:3};
}

/* ---------- Sky ---------- */
function mix(a, b, t){ const p = x => [1,3,5].map(i => parseInt(x.slice(i, i+2), 16)); const A = p(a), B = p(b); return '#' + A.map((v, i) => Math.round(v + (B[i]-v)*t).toString(16).padStart(2, '0')).join(''); }
function skyOf(pm, dark = isDark()){
  const t = Math.min(1, pm / 260);
  const clear = dark ? ['#0E2A45','#2B557C'] : ['#5BA6E6','#D4EAF9'];
  const hazy  = dark ? ['#363128','#6E6352'] : ['#AFA796','#E6DFD1'];
  const thick = dark ? ['#3A2416','#7E5534'] : ['#8E7258','#D9BE9C'];
  const pick = i => t < .5 ? mix(clear[i], hazy[i], t*2) : mix(hazy[i], thick[i], (t-.5)*2);
  return {top:pick(0), bot:pick(1), t, ink: dark ? '#F3EEE6' : '#17222B', chip: dark ? 'rgba(0,0,0,.28)' : 'rgba(255,255,255,.5)', halo: dark ? 'rgba(0,0,0,.35)' : 'rgba(255,255,255,.75)'};
}
function applySky(pm){
  const s = skyOf(pm), st = document.documentElement.style;
  for (const [k, v] of Object.entries({'--sky-top':s.top, '--sky-bot':s.bot, '--sky-ink':s.ink, '--sky-chip':s.chip, '--sky-halo':s.halo})) st.setProperty(k, v);
}
let raf = 0;
function grain(el, pm){
  cancelAnimationFrame(raf); if (!el) return;
  const cv = document.createElement('canvas'); el.prepend(cv);
  const box = el.getBoundingClientRect(), dpr = Math.min(2, devicePixelRatio || 1);
  cv.width = box.width * dpr; cv.height = box.height * dpr;
  const ctx = cv.getContext('2d'); ctx.scale(dpr, dpr);
  const s = skyOf(pm), N = Math.round(20 + pm * 1.6);
  const pts = Array.from({length:N}, () => ({x:Math.random()*box.width, y:Math.random()*box.height, r:.5+Math.random()*1.6, a:.12+Math.random()*.3, vx:.08+Math.random()*.25, vy:(Math.random()-.5)*.08}));
  const col = isDark() ? '255,235,205' : (s.t > .3 ? '100,80,55' : '255,255,255');
  const still = matchMedia('(prefers-reduced-motion: reduce)').matches;
  const draw = () => {
    ctx.clearRect(0, 0, box.width, box.height);
    for (const p of pts){ if (!still){ p.x += p.vx; p.y += p.vy; if (p.x > box.width + 2) p.x = -2; }
      ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 7); ctx.fillStyle = `rgba(${col},${p.a})`; ctx.fill(); }
    if (!still && S.tab === 'now') raf = requestAnimationFrame(draw);
  };
  draw();
}

/* ---------- Links to the official source ---------- */
const OFFICIAL = 'https://www.haze.gov.sg/', NEA_GUIDE = 'https://www.haze.gov.sg/docs/default-source/posters/haze-pm-psi-guide-a4-english.pdf';
const ext = (href, text) => `<a class="ext" href="${href}" target="_blank" rel="noopener">${text}${ICON.out}</a>`;
const officialLine = () => `<p class="official">Unofficial view of NEA data. For official readings, advisories and the haze situation, see ${ext(OFFICIAL, 'haze.gov.sg')}.</p>`;

/* ---------- Now ---------- */
const psiStart = k => k === 0 ? 0 : PSI[k-1].max + 1;
function psiRange(lo, hi){ const a = psiStart(lo), b = PSI[hi].max; return b === Infinity ? `${a}+` : `${a}–${b}`; }
/* A bar drawn by band: a pin with the reading above it, and a bracket under the forecast bands */
const bandLo = (B, k) => k === 0 ? 0 : B[k-1].max + 1;
const bandHi = (B, k) => B[k].max === Infinity ? (B === PM ? 350 : 400) : B[k].max;
function hbar({B, v, label, fc, onSky}){
  const N = B.length, k = B.findIndex(x => v <= x.max), lo = bandLo(B, k), hi = bandHi(B, k);
  const t = (k + Math.max(0, Math.min(1, (v - lo) / (hi - lo)))) / N, cl = (x, a, b) => Math.max(a, Math.min(b, x));
  const on = i => fc ? i >= fc.lo && i <= fc.hi : i === k;
  const vars = onSky ? '--pin-bg:var(--sky-ink);--pin-fg:var(--sky-top);--pin-halo:var(--sky-halo)' : '--pin-bg:var(--ink);--pin-fg:var(--surface);--pin-halo:var(--surface)';
  return `<div class="hb" style="${vars}">
    <div class="pin" style="left:${(cl(t, .05, .95) * 100).toFixed(1)}%"><b class="num">${esc(label)}</b></div>
    <div class="track" style="grid-template-columns:repeat(${N},1fr)">${B.map((x, i) => `<i style="background:var(--c${x.c});opacity:${on(i) ? 1 : .35}"></i>`).join('')}</div>
    ${fc ? `<div class="rng"><span style="left:${fc.lo / N * 100}%;width:${(fc.hi - fc.lo + 1) / N * 100}%"></span><em class="num" style="left:${(cl((fc.lo + fc.hi + 1) / 2 / N, .15, .85) * 100).toFixed(1)}%">Forecast ${psiRange(fc.lo, fc.hi)}</em></div>` : ''}
    <div class="labs" style="grid-template-columns:repeat(${N},1fr)">${B.map((x, i) => `<span style="opacity:${on(i) ? 1 : .6}">${B === PM ? x.n + ' · ' : ''}${x.name === 'Very Unhealthy' ? 'V. Unhealthy' : x.name}</span>`).join('')}</div></div>`;
}
function renderNow(){
  const el = document.getElementById('v-now'), n = now(P.region), f = S.d.fc, r = fcRel();
  const plan = f ? PSI[f.hi] : n.p;
  const day = f ? `${r === 1 ? 'Tomorrow' : 'Today'} · ${sgDay(f.date, true)}` : `Today · ${sgDay(S.d.asOf, true)}`;
  el.innerHTML = `
    <div class="sky">
      <div class="eb">Now <span class="sub">· the next hour</span></div>
      <div class="big" style="background:var(--c${n.b.c});color:var(--on${n.b.c})">${n.b.name}</div>
      <div class="bign num">${n.pm}<small>µg/m³</small></div>
      <div class="nlab"><button class="term" data-act="explain">1-hr PM2.5</button> · average over the past hour · Band ${n.b.n}</div>

function step(when, sub, advice, c, why){

    <div><div class="when">${when} <span>${sub}</span></div><div class="v">${V.w}</div><div class="a">${esc(advice)}</div><div class="why num">${why}</div></div></div>`;
}
function renderDay(){
  const el = document.getElementById('v-day'), n = now(P.region), f = S.d.fc, rel = fcRel();
  const todayB = f && rel === 0 ? PSI[f.hi] : n.p;   // forecast if it covers today, else the current reading
  const steps = [
    step('Next hour', `· from ${sgHour(S.d.asOf)}`, pmAdvice(n.b), n.b.c, `${badge(n.b.c, 'Band ' + n.b.n + ' · ' + n.b.name)} 1-hr PM2.5 ${n.pm} µg/m³`),
    step('Rest of today', `· ${sgDay(S.d.asOf, true)}`, psiAdvice(todayB), todayB.c, f && rel === 0 ? `${fcBadges()} PSI forecast` : `${badge(n.p.c, n.p.name)} 24-hr PSI now ${n.psi}`)];
  if (f && rel === 1) steps.push(step('Tomorrow', `· ${sgDay(f.date, true)}`, psiAdvice(PSI[f.hi]), PSI[f.hi].c, `${fcBadges()} PSI forecast`));
  else steps.push(`<div class="step"><span class="mk" style="background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)">${ICON.light}</span>
      <div><div class="when">Tomorrow <span>· ${sgDay(new Date(S.d.asOf.getTime() + 86400e3), true)}</span></div><div class="v" style="color:var(--muted)">Not yet issued</div>
      <div class="a" style="color:var(--muted)">NEA usually issues the next day’s PSI forecast in the evening.</div></div></div>`);
  const worst = Math.max(verdict(pmAdvice(n.b)).k, verdict(psiAdvice(todayB)).k);
  const head = ['Normal activities can continue today.', 'Reduce strenuous outdoor activity today.', 'Limit prolonged or strenuous outdoor exertion today.', 'Minimise time outdoors today.'][worst];
  el.innerHTML = `<div class="day">

}

/* ---------- History: fixed axes, every band visible, tap or drag to read any hour ---------- */
const HG = {W:340, H:200, pl:28, pr:8, pt:6, pb:22};
const hx = (i, n) => HG.pl + (HG.W - HG.pl - HG.pr) * i / (n - 1);
const hy = (v, top) => HG.pt + (HG.H - HG.pt - HG.pb) * (1 - Math.min(v, top) / top);
const SERIES = () => { const R = S.d.regions[P.region], n = S.d.li + 1;
  return [{key:'pm', vals:R.pm.slice(0, n), bands:PM, top:300, unit:'µg/m³', band:v => PM[pmIdx(v)], lab:b => `Band ${b.n} · ${b.name}`},
          {key:'psi', vals:R.psi.slice(0, n), bands:PSI, top:400, unit:'PSI', band:v => PSI[psiIdx(v)], lab:b => b.name}]; };
function chart(s, title){
  const {W, H, pl, pr, pb} = HG, n = s.vals.length;
  let lo = 0, g = '';
  for (const b of s.bands){
    const hi = Math.min(b.max, s.top), y0 = hy(lo, s.top), y1 = hy(hi, s.top);
    g += `<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${y0-y1}" fill="var(--tn${b.c})"/><rect x="${pl}" y="${y1}" width="3" height="${y0-y1}" fill="var(--c${b.c})"/>`;
    g += `<text class="bl" x="${W-pr-6}" y="${(y0+y1)/2+3.5}" text-anchor="end" style="fill:var(--fg${b.c})">${esc(s.key === 'pm' ? `${b.n} · ${b.name}` : b.name)}</text>`;
    if (b.max < s.top) g += `<text x="${pl-5}" y="${y1+3.5}" text-anchor="end">${b.max}</text>`;
    lo = hi;
  }
  const pts = s.vals.map((v, i) => v == null ? null : [hx(i, n), hy(v, s.top), v]).filter(Boolean);
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--c${s.band(p[2]).c})" stroke="var(--ink)" stroke-width=".8"/>`).join('');
  const xl = [0, 6, 12, 18, n-1].map(i => `<text x="${hx(i, n)}" y="${H-6}" text-anchor="${i === 0 ? 'start' : i === n-1 ? 'end' : 'middle'}">${i === n-1 ? 'Now' : sgHour(S.d.times[i])}</text>`).join('');
  return `<svg class="chart" data-chart="${s.key}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(title)}. Tap, drag or use the arrow keys to read each hour.">${g}<text x="${pl-5}" y="${hy(0, s.top)+3.5}" text-anchor="end">0</text>
    <path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>${dots}${xl}<g class="cross"></g></svg>`;
}
function drawSel(){
  const i = S.hi, t = S.d.times[i], when = `${i === S.d.li ? 'Now · ' : ''}${sgHour(t)}, ${sgDay(t, true)}`;
  for (const s of SERIES()){
    const svg = document.querySelector(`[data-chart="${s.key}"]`), ro = document.getElementById('ro-' + s.key);
    if (!svg || !ro) continue;
    const v = s.vals[i], X = hx(i, s.vals.length);
    svg.querySelector('.cross').innerHTML = `<line x1="${X}" x2="${X}" y1="${HG.pt}" y2="${HG.H-HG.pb}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`
      + (v == null ? '' : `<circle cx="${X}" cy="${hy(v, s.top)}" r="6.5" fill="var(--c${s.band(v).c})" stroke="var(--ink)" stroke-width="2.5"/>`);
    ro.innerHTML = v == null ? `<span class="rn">–</span><span class="rt">No reading at ${when}</span>`
      : `<span class="rn" style="color:var(--fg${s.band(v).c})">${v}</span><span class="rd"><span>${s.unit} ${badge(s.band(v).c, s.lab(s.band(v)))}</span><span class="rt">${when}</span></span>`;
  }
}
function pickHour(e){
  const svg = e.target.closest && e.target.closest('svg[data-chart]'); if (!svg) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * HG.W, n = S.d.li + 1;
  const i = Math.max(0, Math.min(n - 1, Math.round((vx - HG.pl) / (HG.W - HG.pl - HG.pr) * (n - 1))));
  if (i !== S.hi){ S.hi = i; drawSel(); }
}
function renderHist(){

/* Use my location: GPS position → nearest named area → that area's NEA region */
async function geolocate(){
  const btn = document.getElementById('geo'), say = t => { const m = document.getElementById('geomsg'); if (m) m.textContent = t; };
  if (!('geolocation' in navigator)) return say('This browser can’t share its location. Pick your region below.');
  if (!window.isSecureContext) return say('Browsers only share location with secure (https) pages. Open https://haze.geewax.org, or pick your region below.');
  let state = null;
  try { state = (await navigator.permissions.query({name:'geolocation'})).state; } catch(e) {}
  if (state === 'denied') return say('Location is blocked for this site. Allow it in your browser’s site settings, or pick your region below.');
  say('Finding your location…'); if (btn) btn.disabled = true;
  navigator.geolocation.getCurrentPosition(pos => {
    if (btn) btn.disabled = false;
    const {latitude:la, longitude:lo} = pos.coords;
    if (la < 1.15 || la > 1.48 || lo < 103.6 || lo > 104.1) return say('You seem to be outside Singapore. Pick a region below.');
    const a = nearestArea(la, lo);
    placeFound(a[0], a[1]);
  }, err => {
    if (btn) btn.disabled = false;
    say(err.code === 1 ? 'Location permission wasn’t given. Allow location for this site in your browser settings, and turn on Location Services for your browser on a phone. Or pick your region below.'
      : err.code === 3 ? 'Finding your location took too long. Try again, or pick your region below.'
      : 'Your device couldn’t work out where you are. Try again with Wi-Fi on, or pick your region below.');
  }, {enableHighAccuracy:false, timeout:15000, maximumAge:10 * 60e3});
}

async function copy(text, btn){

/* The picture card: 1080×1350, always in the light palette so it looks the same for everyone it reaches */

  x.globalAlpha = 1; font(800, 56, D); x.fillText('Haze', pad + 70, 118);

    x.fillStyle = CARD.ink; rr(x, lx, by - 52, lw, 36, 9); x.fill(); x.fillRect(m - 2.5, by - 18, 5, 40);

async function shareImage(btn){
  const lbl = btn.querySelector('.lbl'), was = lbl.textContent;
  const name = `haze-${P.region}-${sgDay(S.d.asOf).replace(' ', '-').toLowerCase()}.png`;

/* ---------- Events ---------- */
document.getElementById('app').addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.id === 'geo') return geolocate();
  if (b.id === 'copyLink') return copy(shareURL(), b);
  if (b.id === 'copyMsg') return copy(shareText(), b);
  if (b.id === 'shareMore'){ navigator.share({title:'Haze', text:shareText(false), url:shareURL()}).catch(() => {}); return; }
  if (b.id === 'shareImg') return shareImage(b);
  if (b.id === 'retry'){ showStatus('Loading the latest readings from NEA…'); return refresh(); }
  if (b.id === 'reset'){ try { localStorage.removeItem(KEY); } catch(e) {} Object.assign(P, DEFAULTS); keepRegion = null; render(); document.getElementById('resetmsg').textContent = 'Settings reset.'; return; }
  if (b.dataset.hour){ S.hi = +b.dataset.hour; return drawSel(); }
  if (b.dataset.region){ S.hi = null; return setRegion(b.dataset.region); }
  if (b.dataset.group){ P.group = b.dataset.group; save(); return render(); }
  if (b.dataset.start){ P.start = b.dataset.start; save(); return render(); }
  if (b.dataset.tab){ closeSheet(); S.tab = b.dataset.tab; render(); document.getElementById('v-' + S.tab).scrollTop = 0; return; }
  const a = b.dataset.act;
  if (a === 'region') openSheet('Your region', regionSheetHTML());
  if (a === 'explain') openSheet('Understanding the readings', explainHTML());
  if (a === 'news') openSheet('NEA update', newsHTML());
  if (a === 'share') openShare();
});

/* ---------- Render ---------- */
function render(){
  if (!S.d) return;
  const n = now(P.region);
  applySky(n.pm);
  document.getElementById('regionChip').innerHTML = `${ICON.pin}${RNAME[P.region]}${ICON.down}`;
  document.querySelector('.hdr [data-act="explain"]').innerHTML = ICON.info;
  const late = S.live && Date.now() - S.d.asOf.getTime() > 3 * 3600e3;   // NEA normally publishes within the hour
  document.getElementById('upd').innerHTML = `<i style="background:${S.live && !late ? 'var(--c0)' : 'var(--c3)'}"></i>${!S.live ? 'Snapshot' : late ? 'Delayed' : 'Live'} · ${sgHour(S.d.asOf)}, ${sgDay(S.d.asOf)}`;
  document.querySelectorAll('#tabbar button, .topnav button').forEach(b => b.setAttribute('aria-selected', b.dataset.tab === S.tab));
  for (const t of ['now','day','hist','set']) document.getElementById('v-' + t).hidden = t !== S.tab;
  if (S.tab !== 'now') cancelAnimationFrame(raf);
  ({now:renderNow, day:renderDay, hist:renderHist, set:renderSet})[S.tab]();
}
matchMedia('(prefers-color-scheme: dark)').addEventListener('change', render);
new MutationObserver(render).observe(document.documentElement, {attributes:true, attributeFilter:['data-theme']});
addEventListener('resize', () => { if (S.tab === 'now') renderNow(); });

/* ---------- Boot: live data from NEA, refreshed while the page is open ---------- */
function showStatus(text, retry){
  document.getElementById('upd').textContent = retry ? 'Offline' : 'Loading…';
  document.getElementById('regionChip').innerHTML = `${ICON.pin}${RNAME[P.region]}${ICON.down}`;
  document.querySelector('.hdr [data-act="explain"]').innerHTML = ICON.info;
  for (const t of ['now','day','hist','set']) document.getElementById('v-' + t).hidden = t !== 'now';
  document.getElementById('v-now').innerHTML = `<div class="day" style="justify-content:center;align-items:center;text-align:center">
    <p style="max-width:30ch;margin:0;color:var(--muted)">${esc(text)}</p>${retry ? '<button class="plain" id="retry">Try again</button>' : ''}</div>`;
}
let loadedAt = 0;
async function refresh(){
  try { S.d = await loadLive(); S.live = true; loadedAt = Date.now(); render(); }
  catch(e){ if (!S.d) showStatus('Couldn’t reach NEA’s air quality service. Check your connection and try again.', true); }
}
S.d = SNAP_AQ ? normalise(SNAP_AQ, SNAP_ADV) : null;
if (S.d) render(); else showStatus('Loading the latest readings from NEA…');
refresh();
setInterval(() => { if (document.visibilityState === 'visible') refresh(); }, 10 * 60e3);
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible' && Date.now() - loadedAt > 5 * 60e3) refresh(); });
</script>
