<title>Haze Status</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..800&family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one-column app. A sky-coloured header bar (tinted by today's air) over four tabbed views and a bottom tab bar.
   Phone: full screen. Desktop: the sky fills the window and the app floats as a card. */
:root{
  --bg:#EDF1F4; --surface:#FFFFFF; --surface-2:#F4F7F9; --ink:#12202B; --muted:#5A6A77; --line:#D9E0E6;
  --accent:#1D5C88; --accent-ink:#FFFFFF;
  --c0:#479B02; --c1:#006FA1; --c2:#FFCE03; --c3:#FFA800; --c4:#D60000;           /* NEA official */
  --on0:#FFFFFF; --on1:#FFFFFF; --on2:#1F1A00; --on3:#1F1400; --on4:#FFFFFF;
  --fg0:#3A7F02; --fg1:#006FA1; --fg2:#8A6D00; --fg3:#A86200; --fg4:#C00000;      /* as text on surface */
  --tn0:#DDEFD3; --tn1:#D4E8F4; --tn2:#FFF5C9; --tn3:#FFEBC6; --tn4:#F8D3CE;
  --display:'Bricolage Grotesque','Noto Sans SC','Noto Sans Tamil','Avenir Next','Segoe UI',system-ui,sans-serif;
  --body:'Public Sans','Noto Sans SC','Noto Sans Tamil','Helvetica Neue','Segoe UI',system-ui,sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0B1116; --surface:#141D25; --surface-2:#1A242D; --ink:#E5ECF1; --muted:#93A3B0; --line:#26333E;
  --accent:#73B6E3; --accent-ink:#0B1116;
  --fg0:#7BC64A; --fg1:#55A9DA; --fg2:#FFCE03; --fg3:#FFA800; --fg4:#FF6152;
  --tn0:#1C2D12; --tn1:#0F2738; --tn2:#363010; --tn3:#3A2A0F; --tn4:#3A1512; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0B1116; --surface:#141D25; --surface-2:#1A242D; --ink:#E5ECF1; --muted:#93A3B0; --line:#26333E;
  --accent:#73B6E3; --accent-ink:#0B1116;
  --fg0:#7BC64A; --fg1:#55A9DA; --fg2:#FFCE03; --fg3:#FFA800; --fg4:#FF6152;
  --tn0:#1C2D12; --tn1:#0F2738; --tn2:#363010; --tn3:#3A2A0F; --tn4:#3A1512; color-scheme:dark}

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--sky-bot,var(--bg));background-image:linear-gradient(var(--sky-top,var(--bg)),var(--sky-bot,var(--bg)));color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;-webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-variant-numeric:tabular-nums}

.app{position:relative;height:100%;width:100%;background:var(--surface);display:flex;flex-direction:column;overflow:hidden;isolation:isolate}

/* header bar */
.hdr{display:flex;align-items:center;gap:8px;padding:calc(10px + env(safe-area-inset-top,0px)) 10px 10px 18px;background:var(--sky-top);color:var(--sky-ink);position:relative;z-index:2}
.logo{display:flex;align-items:center;gap:9px;margin-right:auto;min-width:0}
.logo svg{width:28px;height:28px;flex:none}
@media (max-width:389px){.logo svg{display:none}}
.logo b{font-family:var(--display);font-weight:800;font-size:21px;letter-spacing:-.02em;line-height:1;display:block}
.logo small{display:block;font-size:11.5px;opacity:.75;margin-top:2px;white-space:nowrap}
.logo small i{display:inline-block;width:7px;height:7px;border-radius:50%;margin-right:5px;vertical-align:1px}
.chip{display:inline-flex;align-items:center;gap:5px;border:0;border-radius:999px;padding:7px 10px 7px 9px;font-weight:700;font-size:14px;color:var(--sky-ink);background:var(--sky-chip)}
.chip svg{width:16px;height:16px;flex:none}
.iconbtn{border:0;background:transparent;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;color:inherit}
.iconbtn svg{width:20px;height:20px}

.view{flex:1;min-height:0;display:flex;flex-direction:column;overflow-y:auto;overscroll-behavior:contain}
.view[hidden]{display:none}

/* tab bar */
.tabbar{display:grid;grid-template-columns:repeat(4,1fr);border-top:1px solid var(--line);background:var(--surface);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:none;display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 0;font-size:11.5px;font-weight:600;color:var(--muted);border-radius:10px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-selected="true"]{color:var(--ink)}
.tabbar button[aria-selected="true"] svg{stroke-width:2.4}

/* atoms */
.row{display:flex;justify-content:space-between;align-items:center;gap:8px}
.eb{font-size:11.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase}
.eb .sub{font-weight:600;letter-spacing:.02em;text-transform:none;opacity:.75;margin-left:2px}
.link{border:0;background:none;padding:0;color:var(--accent);font-weight:600;font-size:14px;display:inline-flex;align-items:center;gap:4px}
.link svg{width:16px;height:16px}
.foot{font-size:12px;color:var(--muted)}
.ext{color:var(--accent);font-weight:600;text-decoration:none;display:inline-flex;align-items:center;gap:3px;white-space:nowrap}
.ext svg{width:.95em;height:.95em}
.ext:hover{text-decoration:underline}
.official{font-size:12.5px;color:var(--muted);margin:2px 0 0;line-height:1.45}
.term{border:0;background:none;padding:0;font:inherit;color:inherit;text-decoration:underline dotted;text-underline-offset:3px}
.for{font-size:12.5px;opacity:.8}
.for button{border:0;background:none;padding:0;font:inherit;color:inherit;font-weight:700;text-decoration:underline;text-underline-offset:2px}
.badge{display:inline-flex;align-items:center;justify-content:center;font-size:11.5px;font-weight:800;padding:3px 8px;border-radius:6px;white-space:nowrap;min-width:34px}

/* Now */
.sky{position:relative;color:var(--sky-ink);background:linear-gradient(var(--sky-top),var(--sky-bot));padding:10px 22px 22px;flex:1.15 0 auto;display:flex;flex-direction:column}
.sky canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.sky > *:not(canvas){position:relative}
.big{font-family:var(--display);font-weight:750;font-size:clamp(44px,13vw,54px);line-height:1;letter-spacing:-.035em;margin:8px 0 8px;align-self:flex-start;padding:.02em .16em .06em;border-radius:.16em;margin-left:-.1em}
.ahead{flex:1 0 auto;padding:18px 22px 14px;display:flex;flex-direction:column;gap:10px;background:var(--surface)}
/* the lean Now screen: each fact once; definitions and NEA's wording behind a tap */
.head2{font-family:var(--display);font-weight:700;font-size:24px;line-height:1.1;letter-spacing:-.02em}
.lnum{display:flex;align-items:baseline;gap:8px;border:0;background:none;padding:0;color:inherit;text-align:left}
.lnum .v{font-family:var(--display);font-weight:700;font-size:54px;line-height:1;letter-spacing:-.03em}
.lnum .k{display:flex;flex-direction:column;line-height:1.15;padding-bottom:4px}
.lnum .k b{font-size:16px;font-weight:800}
.lnum .k small{font-size:12px;font-weight:600;opacity:.8}
.trend{font-size:13.5px;line-height:1.3;margin-top:10px}
.trend b{display:inline-block;padding:3px 10px 4px;margin-right:4px;border-radius:999px;background:var(--sky-chip)}
.trend b.up{background:var(--c4);color:var(--on4)}
.trend b.down{background:var(--c0);color:var(--on0)}
.trend span{display:inline-block}
.lbw{margin-top:10px}
.lpair{display:grid;grid-template-columns:fit-content(48%) minmax(0,1fr);gap:20px}
.lpair > button{display:flex;flex-direction:column;align-items:flex-start;gap:2px;border:0;background:none;padding:0;color:inherit;text-align:left;min-width:0}
.lpair > button + button{padding-left:20px;border-left:1px solid var(--line)}
.lpair .v{font-family:var(--display);font-weight:700;font-size:clamp(36px,11vw,44px);line-height:1;letter-spacing:-.03em;white-space:nowrap}
.lpair .k{display:flex;flex-direction:column;line-height:1.2;color:var(--muted)}
.lpair .k b{font-size:13.5px;font-weight:800;color:var(--ink)}
.lpair .k small{font-size:12px;font-weight:600}
.lb{position:relative;padding-top:14px}
.lb .track{display:grid;gap:3px}
.lb .track i{height:12px;border-radius:3px;display:block}
.lb .tick{position:absolute;top:0;transform:translateX(-50%);width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;border-top:10px solid var(--tick)}
.lb .br{position:relative;height:12px;margin-top:3px}
.lb .br span{position:absolute;top:0;height:8px;border:2.5px solid var(--ink);border-top:0;border-radius:0 0 6px 6px}
.lb .br:has(.fcl){height:29px}
.lb .fcl{position:absolute;top:13px;font-size:12px;font-weight:800;line-height:1.2;color:var(--ink);white-space:nowrap}
.advw{margin-top:14px}
.adv{border:0;background:none;padding:0;color:inherit;text-align:left;font-family:var(--display);font-weight:600;font-size:21px;line-height:1.22;text-wrap:balance}
.adv::after{content:" ⓘ";font-family:var(--body);font-size:.65em;opacity:.55;vertical-align:.15em}
.adv.plan{font-size:19px}
.nea{font-size:12.5px;line-height:1.4;opacity:.85;margin-top:6px}
.lfoot{font-size:12px;color:var(--muted);text-align:center;margin-top:2px}
.lfoot .nw{white-space:nowrap}
.whosel{position:relative;display:inline-block;max-width:100%;color:var(--ink);font-weight:700;text-decoration:underline dotted;text-underline-offset:3px}
.whosel svg{width:13px;height:13px;vertical-align:-2px;margin-left:1px}
.whosel select{position:absolute;inset:0;width:100%;opacity:0;font-size:16px;cursor:pointer}
.pop{position:absolute;left:12px;right:12px;bottom:calc(76px + env(safe-area-inset-bottom,0px));max-width:440px;margin:0 auto;background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:18px;padding:14px 16px;box-shadow:0 18px 40px -18px rgba(0,0,0,.5);font-size:13.5px;line-height:1.45;z-index:4}
.pop b{display:block;font-size:14.5px;margin-bottom:3px}
/* language switch: a quiet row under the Now footer, and a segmented control in Settings */
.langs{display:flex;justify-content:center;flex-wrap:wrap;gap:2px 4px;margin-top:2px}
.langs button{border:0;background:none;padding:4px 8px;border-radius:999px;font-size:12.5px;color:var(--muted)}
.langs button[aria-pressed="true"]{color:var(--ink);font-weight:700;background:var(--surface-2)}
.langseg{flex-wrap:wrap}
.langseg button{flex:1 1 40%}
/* install as an app */
.inst{display:flex;align-items:center;gap:10px;margin-top:18px;padding:10px 4px 10px 10px;border-radius:14px;background:var(--sky-chip);color:var(--sky-ink);font-size:12.5px;line-height:1.3}
.inst > span{flex:1;min-width:0}
.inst b{display:block;font-size:13.5px}
.apptile{width:36px;height:36px;flex:none;border-radius:8px;box-shadow:0 2px 6px rgba(0,0,0,.25)}
.locbtn .apptile{width:24px;height:24px;border-radius:6px}
.instgo{border:0;border-radius:999px;background:var(--sky-ink);color:var(--sky-top);font-weight:800;padding:7px 15px;font-size:13px}
.instx{width:30px;height:30px}
.instx svg{width:15px;height:15px}
.steps{margin:0;padding-left:20px;display:grid;gap:8px;font-size:15px}
.steps svg{width:18px;height:18px;vertical-align:-3px}
/* the share panel: Share on WhatsApp (the picture) and Share (every other way), side by side */
.share2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:4px}
.share2 button{display:flex;align-items:center;justify-content:center;gap:8px;min-width:0;min-height:52px;border-radius:14px;padding:10px 12px;font-weight:800;font-size:15.5px;line-height:1.2;text-align:center;text-wrap:balance}
.share2 svg{width:20px;height:20px;flex:none}
.s2wa{border:0;background:#25D366;color:#062B14}
.s2all{border:1px solid var(--line);background:var(--surface-2);color:var(--ink)}
.thumb{width:66px;aspect-ratio:4/5;border:3px solid #FFFFFF;border-radius:9px;padding:0;background:linear-gradient(#C9BFA9,#EDE5D3) center/cover no-repeat;box-shadow:0 8px 18px -8px rgba(0,0,0,.55);transform:rotate(-5deg);transition:transform .2s}
.thumb.mini{width:30px;border-width:2px;border-radius:5px;transform:rotate(-5deg);display:inline-block;flex:none}

/* My day */
.day{padding:18px 20px 16px;display:flex;flex-direction:column;gap:14px;flex:1 0 auto}
.day h2{font-family:var(--display);font-size:30px;line-height:1.08;margin:0;letter-spacing:-.02em;text-wrap:balance}
.tl{display:flex;flex-direction:column;position:relative}
.tl::before{content:"";position:absolute;left:17px;top:24px;bottom:34px;width:2px;background:var(--line)}
.step{display:grid;grid-template-columns:36px 1fr;gap:12px;padding:10px 0;position:relative}
.mk{width:36px;height:36px;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 0 4px var(--surface)}
.mk svg{width:19px;height:19px}
.when{font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;font-weight:800;color:var(--muted)}
.when span{text-transform:none;letter-spacing:0;font-weight:600}
.v{font-family:var(--display);font-size:22px;font-weight:650;line-height:1.15;margin:2px 0 3px}
.a{font-size:14.5px;line-height:1.4}
.why{font-size:12.5px;color:var(--muted);margin-top:6px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.news{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:13px 15px;font-size:13.5px;line-height:1.45;text-align:left;color:inherit;width:100%}
.news b{display:block;font-size:11.5px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin-bottom:4px}

/* History */
.hist{padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px}
.hist h2,.set h2{font-family:var(--display);font-size:28px;margin:0;letter-spacing:-.02em;line-height:1.1}
.hist .lead{font-size:13.5px;color:var(--muted);margin:4px 0 0}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stats > div,.stats > button{background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:10px 12px}
.stats .k{font-size:11px;font-weight:700;color:var(--muted);letter-spacing:.04em;text-transform:uppercase}
.stats .n{font-family:var(--display);font-size:26px;font-weight:700;line-height:1.1}
.stats .t{font-size:11.5px;color:var(--muted)}
.sec h3{font-size:12px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;font-weight:800}
.sec h3 span{text-transform:none;letter-spacing:0;font-weight:600}
.chart{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-size:10px;font-family:var(--body)}
.chart .bl{font-weight:700;font-size:10px}
.chart .end{fill:var(--ink);font-weight:800;font-size:11.5px}
.chart[data-chart]{touch-action:pan-y;cursor:crosshair;-webkit-tap-highlight-color:transparent}
.ro{display:flex;align-items:center;gap:12px;min-height:46px;margin-bottom:6px}
.ro .rn{font-family:var(--display);font-size:36px;font-weight:700;line-height:1;min-width:2.2ch}
.ro .rd{display:flex;flex-direction:column;gap:3px;font-size:13px}
.ro .rt{font-size:12.5px;color:var(--muted)}
.stats button{font:inherit;color:inherit;text-align:left;cursor:pointer}

/* Settings */
.set{padding:18px 20px 28px;display:flex;flex-direction:column;gap:22px}
.group{background:var(--surface-2);border:1px solid var(--line);border-radius:16px;overflow:hidden}
.opt{display:grid;grid-template-columns:1fr auto;align-items:center;gap:1px 10px;width:100%;border:0;border-top:1px solid var(--line);background:none;padding:12px 14px;text-align:left}
.opt:first-child{border-top:0}
.opt .nm{font-weight:700;font-size:15px}
.opt .ex{font-size:12.5px;color:var(--muted);grid-column:1}
.opt .side{grid-row:1 / span 2;grid-column:2;display:flex;gap:8px;align-items:center}
.radio{width:20px;height:20px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center}
.opt[aria-pressed="true"] .radio{border-color:var(--accent)}
.opt[aria-pressed="true"] .radio::after{content:"";width:10px;height:10px;border-radius:50%;background:var(--accent)}
.xgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;max-width:340px;margin:0 auto;width:100%}
.xt{border:1.5px solid var(--line);background:var(--surface-2);border-radius:16px;padding:12px 6px;min-height:82px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px}
.xt .nm{font-weight:700;font-size:15px}
.xt[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 1.5px var(--accent) inset;background:var(--surface)}
.xt[aria-pressed="true"] .nm::after{content:" ✓";color:var(--accent)}
.x-north{grid-column:2;grid-row:1}.x-west{grid-column:1;grid-row:2}.x-central{grid-column:2;grid-row:2}.x-east{grid-column:3;grid-row:2}.x-south{grid-column:2;grid-row:3}
.seg{display:flex;background:var(--surface-2);border:1px solid var(--line);border-radius:12px;padding:3px;gap:2px}
.seg button{flex:1;border:0;background:transparent;border-radius:9px;padding:8px 4px;font-size:13.5px;font-weight:600;color:var(--muted)}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 1px 3px rgba(0,0,0,.12)}
.locbtn{display:flex;align-items:center;gap:10px;width:100%;border:0;background:var(--accent);color:var(--accent-ink);border-radius:14px;padding:13px 16px;font-weight:700;font-size:15px}
.locbtn svg{width:20px;height:20px}
.locbtn:disabled{opacity:.6;cursor:progress}
.msg{font-size:13px;color:var(--muted);margin:8px 2px 10px}
.plain{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:10px 14px;font-weight:600;font-size:14px}

/* sheet (region picker, explainer, NEA statement) */
.scrim{position:absolute;inset:0;background:rgba(5,10,15,.4);opacity:0;pointer-events:none;transition:opacity .25s;z-index:5}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:absolute;left:0;right:0;bottom:0;max-height:90%;background:var(--surface);color:var(--ink);border-radius:24px 24px 0 0;z-index:6;transform:translateY(102%);transition:transform .3s cubic-bezier(.2,.8,.2,1);display:flex;flex-direction:column}
.sheet.on{transform:none}
.grab{width:40px;height:5px;border-radius:3px;background:var(--line);margin:8px auto 4px;flex:none}
.sheet .sh{display:flex;align-items:center;justify-content:space-between;padding:4px 10px 4px 20px}
.sheet h4{font-family:var(--display);font-size:22px;margin:0}
.sheet .sb{overflow-y:auto;padding:6px 20px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:18px}
.sb p{margin:0 0 8px;font-size:14px;line-height:1.5}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.two > div{border-radius:12px;padding:12px;font-size:13px;line-height:1.4;background:var(--surface-2);border:1px solid var(--line)}
.two b{display:block;font-size:14px;margin-bottom:4px}
.mx{display:flex;flex-direction:column;gap:4px}
.mx .r{border-radius:10px;padding:9px 11px;font-size:12.5px;line-height:1.4;display:grid;grid-template-columns:88px 1fr;gap:4px 10px}
.mx .r .h{font-weight:800;font-size:11.5px}
.mx .r .h small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.mx .r.on{box-shadow:0 0 0 2px var(--ink) inset}
/* sharing */
.hdr{gap:4px}
.hdr .iconbtn{width:36px;height:36px}
.hdr .chip{margin-right:2px}
.logo > div{min-width:0}
.logo small{overflow:hidden;text-overflow:ellipsis}
.bubble{background:var(--surface-2);border:1px solid var(--line);border-radius:16px 16px 16px 4px;padding:12px 14px;font-size:14px;line-height:1.5;white-space:pre-wrap;overflow-wrap:anywhere}
.shbtns{display:grid;grid-template-columns:repeat(auto-fit,minmax(62px,1fr));gap:6px}
.shb{display:flex;flex-direction:column;align-items:center;gap:6px;border:0;background:none;padding:4px 0;font-size:12px;font-weight:600;color:var(--ink);text-decoration:none;text-align:center;line-height:1.2}
.si{width:52px;height:52px;border-radius:50%;display:grid;place-items:center;color:#FFFFFF}
.si svg{width:24px;height:24px}
.imgbtn{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;border:1px solid var(--line);background:var(--surface-2);color:var(--ink);border-radius:14px;padding:12px 14px;font-weight:700;font-size:15px}
.imgbtn svg{width:20px;height:20px}
#imgOut{display:flex;flex-direction:column;gap:10px;align-items:flex-start}
#imgOut[hidden]{display:none}
#imgOut img{width:100%;max-width:100%;border-radius:14px;border:1px solid var(--line);display:block}
#imgOut a{text-decoration:none;color:var(--ink)}
.qrbox{display:flex;gap:16px;align-items:center;background:var(--surface-2);border:1px solid var(--line);border-radius:16px;padding:14px}
.qrbox svg{flex:none;width:132px;height:132px;border-radius:8px}
.qrbox b{display:block;font-size:15px;margin-bottom:2px}
.qrbox span{display:block;font-size:13px;color:var(--muted);line-height:1.4}
.qrbox .u{color:var(--ink);font-weight:700;margin-top:8px;-webkit-user-select:all;user-select:all;overflow-wrap:anywhere}

/* Full-bleed at every width: backgrounds run edge to edge, the content column stays at most 600px and centred */
.hdr{padding-left:max(18px,calc(50% - 300px));padding-right:max(10px,calc(50% - 310px))}
.sky,.ahead{padding-left:max(22px,calc(50% - 300px));padding-right:max(22px,calc(50% - 300px))}
.day,.hist,.set{padding-left:max(20px,calc(50% - 300px));padding-right:max(20px,calc(50% - 300px))}
.tabbar{padding-left:max(6px,calc(50% - 300px));padding-right:max(6px,calc(50% - 300px))}
.sheet{margin:0 auto;max-width:640px}
.topnav{display:none}
/* Wide screens: top navigation instead of the tab bar; Now and Today side by side on the sky */
@media (min-width:960px){
  .tabbar{display:none}
  .hdr{padding:14px max(28px,calc(50% - 580px));gap:10px}
  .logo{flex:0 0 auto}
  .topnav{display:flex;gap:4px;margin-right:auto;margin-left:28px}
  .topnav button{border:0;background:transparent;color:var(--sky-ink);font-weight:700;font-size:15px;padding:8px 14px;border-radius:999px;opacity:.75}
  .topnav button[aria-selected="true"]{opacity:1;background:var(--sky-chip)}
  #v-now{flex-direction:row;align-items:center;gap:48px;background:linear-gradient(var(--sky-top),var(--sky-bot));padding:24px max(28px,calc(50% - 580px)) 40px;overflow-y:auto}
  #v-now .sky{flex:1 1 0;background:none;padding:0;align-self:center;min-width:0}
  #v-now{position:relative}
  #v-now > canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #v-now > .sky,#v-now > .ahead{position:relative;z-index:1}
  #v-now .ahead{flex:0 1 500px;min-width:0;border-radius:28px;padding:28px 30px 24px;box-shadow:0 30px 70px -35px rgba(10,20,30,.55);align-self:center}
  .big{font-size:84px}
  .lnum .v{font-size:96px}
  .lnum .k b{font-size:20px}
  .lnum .k small{font-size:14px}
  .trend{font-size:16px}
  .lb .track i{height:14px}
  .adv{font-size:30px;max-width:20ch}
  .adv.plan{font-size:22px}
  .nea{font-size:14px}
  .for{font-size:14px}
  .head2{font-size:30px}
  .lpair .v{font-size:56px}
  .lpair .k{font-size:14px}
  .pop{bottom:24px}
  .day,.hist,.set{padding-left:max(28px,calc(50% - 560px));padding-right:max(28px,calc(50% - 560px));padding-top:32px}
  .tl{display:grid;grid-template-columns:repeat(3,1fr);gap:20px}
  .tl::before{display:none}
  .tl .step{background:var(--surface-2);border:1px solid var(--line);border-radius:18px;padding:18px}
  .day h2{font-size:38px}
  .day .news{max-width:760px}
  .hist{display:grid;grid-template-columns:1fr 1fr;column-gap:32px;align-content:start}
  .hist > :not(.sec){grid-column:1 / -1}
  .set{max-width:none}
  .set > .sec{max-width:640px}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* ---------- Snapshot of real NEA responses (used only when the live fetch is unavailable) ---------- */
const SNAP_AQ = /*AQ*/null;

const ICON = {

  iosShare:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V3.5M7.5 8 12 3.5 16.5 8M5 12.5V20h14v-7.5"/></svg>',
  out:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 5h5v5M19 5l-8 8M17 14v5H5V7h5"/></svg>',
  plane:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 4 3 11.2l6.3 2.3L11.6 20l3.3-4.4 4.6 3.4L21 4zM9.3 13.5 21 4"/></svg>'
};

/* ---------- Settings, saved in this browser ---------- */
const KEY = 'haze-sky:v2';
const LANGS = [['en','English'],['zh','中文'],['ms','Bahasa Melayu'],['ta','தமிழ்']];
const browserLang = () => { for (const l of navigator.languages || [navigator.language || '']){ const k = String(l).slice(0, 2).toLowerCase(); if (['zh','ms','ta','en'].includes(k)) return k; } return 'en'; };
const DEFAULTS = {region:'central', group:'healthy', start:'now', lang:browserLang()};
const P = {...DEFAULTS};
try { const p = JSON.parse(localStorage.getItem(KEY) || '{}');
  if (REGIONS.includes(p.region)) P.region = p.region;
  if (GROUPS.some(g => g.id === p.group)) P.group = p.group;
  if (['now','day'].includes(p.start)) P.start = p.start;
  if (LANGS.some(l => l[0] === p.lang)) P.lang = p.lang; } catch(e) {}
/* A shared link like haze.geewax.org/west/ (or the older #west) opens on that region. It becomes the default only for a
   first-time visitor; anyone who already picked a region keeps it saved and just views the linked one for this visit. */
const ARRIVAL = (() => { const q = new URLSearchParams(location.search);
  return {path: location.pathname, via: q.has('at') ? 'shared-link' : q.has('qr') ? 'qr' : q.has('card') ? 'picture-card' : null}; })();
let keepRegion = null;
{ const fromPath = (/^\/(north|south|east|west|central)\/?$/i.exec(location.pathname) || [])[1];
  const linked = (fromPath || (location.hash || '').slice(1)).toLowerCase();
  if (REGIONS.includes(linked)){
    let stored = null; try { stored = JSON.parse(localStorage.getItem(KEY) || 'null'); } catch(e) {}
    if (stored && REGIONS.includes(stored.region) && stored.region !== linked) keepRegion = stored.region;
    P.region = linked;
    if (!stored) try { localStorage.setItem(KEY, JSON.stringify(P)); } catch(e) {}
  }
  const q = new URLSearchParams(location.search); ['at', 'qr', 'card'].forEach(k => q.delete(k));
  if (fromPath || location.search !== (q.toString() ? '?' + q : '') || REGIONS.includes((location.hash || '').slice(1)))
    try { history.replaceState(null, '', (fromPath ? '/' : location.pathname) + (q.toString() ? '?' + q : '')); } catch(e) {}
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(keepRegion ? {...P, region:keepRegion} : P)); } catch(e) {} }
const S = {tab:P.start, d:null, live:false};
const G = () => GROUPS.find(g => g.id === P.group);

/* ---------- Language. Strings live in src/i18n.js; missing keys fall back to English. ---------- */
const LOCALE = {en:'en-SG', zh:'zh-SG', ms:'ms-SG', ta:'ta-SG'};
function t(key, vars){
  let s = (I18N[P.lang] && I18N[P.lang][key] != null) ? I18N[P.lang][key] : (I18N.en[key] != null ? I18N.en[key] : key);
  return vars ? s.replace(/\{(\w+)\}/g, (_, k) => vars[k] != null ? vars[k] : '') : s;
}
const capFirst = s => s.charAt(0).toUpperCase() + s.slice(1);
/* Put the current language's words into the data the screens read, and into the page's fixed labels */
function applyLang(){
  for (const r of REGIONS){ RNAME[r] = t('region.' + r); REX[r] = t('areas.' + r); }
  for (const b of PM){ const k = 'pm.' + b.n; b.name = t(k); b.gen = t(k + '.gen'); b.vul = t(k + '.vul'); b.sGen = t(k + '.sgen'); b.sVul = t(k + '.svul'); }
  PSI.forEach((b, i) => { const k = 'psi.' + i; b.name = t(k); for (const g of ['healthy','elderly','chronic']){ b[g] = t(`${k}.${g}`); b['s' + capFirst(g)] = t(`${k}.s${g}`); } });
  for (const g of GROUPS){ g.name = t(`group.${g.id}.name`); g.plural = t(`group.${g.id}.plural`); g.who = t(`group.${g.id}.who`); }
  document.documentElement.lang = {en:'en', zh:'zh-Hans-SG', ms:'ms', ta:'ta'}[P.lang];
  document.querySelectorAll('[data-i]').forEach(el => { el.textContent = t(el.dataset.i); });
  document.querySelectorAll('[data-ia]').forEach(el => { el.setAttribute('aria-label', t(el.dataset.ia)); });
  const fam = {zh:'Noto+Sans+SC', ta:'Noto+Sans+Tamil'}[P.lang];   // only fetched when a language needs it
  if (fam && !document.getElementById('font-' + P.lang)){
    const l = Object.assign(document.createElement('link'), {id:'font-' + P.lang, rel:'stylesheet', href:`https://fonts.googleapis.com/css2?family=${fam}:wght@400;500;600;700;800&display=swap`});
    document.head.append(l);
  }
}

/* ---------- Data: fetched by the browser from NEA, snapshot as fallback ---------- */
async function fetchJSON(url, ms){
  const c = new AbortController(), t = setTimeout(() => c.abort(), ms);
  try { const r = await fetch(url, {signal:c.signal}); if (!r.ok) throw new Error(r.status); return await r.json(); }
  finally { clearTimeout(t); }
}
async function loadLive(){
  const ts = Date.now();   // cache-buster, as haze.gov.sg does
  const [aq, adv] = await Promise.all([
    fetchJSON('https://www.haze.gov.sg/api/airquality/jsondata/' + ts, 7000),
    fetchJSON('https://www.nea.gov.sg/api/advisory/latesthazesituationupdate/' + ts, 7000).catch(() => null)]);
  return normalise(aq, adv);
}
const MON = {Jan:0,Feb:1,Mar:2,Apr:3,May:4,Jun:5,Jul:6,Aug:7,Sep:8,Oct:9,Nov:10,Dec:11};
const DOW = ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'];
function parseNea(s){
  const m = /(\d+) (\w{3}) (\d{4}) (\d{1,2})(AM|PM)/.exec(s || ''); if (!m) return null;
  let h = (+m[4]) % 12; if (m[5] === 'PM') h += 12;
  return new Date(Date.UTC(+m[3], MON[m[2]], +m[1], h - 8));
}
const sg = d => new Date(d.getTime() + 8*3600e3);
function sgHourEN(d){ const h = sg(d).getUTCHours(); return (h % 12 || 12) + (h < 12 ? 'am' : 'pm'); }
function sgDayEN(d, dow){ const x = sg(d); return (dow ? DOW[x.getUTCDay()] + ' ' : '') + x.getUTCDate() + ' ' + Object.keys(MON)[x.getUTCMonth()]; }
/* times and dates in Singapore time, in the visitor's language */

      let g = x.createRadialGradient(sp.x, sp.y, 0, sp.x, sp.y, gr);
      g.addColorStop(0, `rgba(${cc},${a * (.6 - .25 * t)})`); g.addColorStop(.18, `rgba(${cc},${a * .22})`); g.addColorStop(1, `rgba(${cc},0)`);
      x.globalAlpha = 1; x.fillStyle = g; x.beginPath(); x.arc(sp.x, sp.y, gr, 0, 7); x.fill();
      const rs = SKY_OPTS.rays ? Math.max(Math.sin(Math.PI * Math.min(1, Math.max(0, (t - .05) / .9))), .35 * gold) * Math.max(0, 1 - sun.alt / 60) * Math.min(1, (sun.alt + 2) / 4) * (1 - cloud * .7) * a : 0;
      if (rs > .02){
        const L = Math.hypot(W, H), base = Math.atan2(H * .5 - sp.y, W * .45 - sp.x) / RAD;
        g = x.createRadialGradient(sp.x, sp.y, rr, sp.x, sp.y, L * .85); g.addColorStop(0, `rgba(${cc},${.2 * rs})`); g.addColorStop(1, `rgba(${cc},0)`);
        x.save(); x.globalCompositeOperation = 'screen'; x.fillStyle = g;
        for (const ray of K.rays){ const an = (base + ray.a + Math.sin(now * .00012 + ray.ph) * 3) * RAD, w = ray.w * RAD;
          x.globalAlpha = .55 + .45 * Math.sin(now * .0004 + ray.ph * 3);
          x.beginPath(); x.moveTo(sp.x, sp.y); x.lineTo(sp.x + Math.cos(an - w) * L, sp.y + Math.sin(an - w) * L); x.lineTo(sp.x + Math.cos(an + w) * L, sp.y + Math.sin(an + w) * L); x.fill(); }
        x.restore();
      }
      g = x.createLinearGradient(0, sp.y - rr, 0, sp.y + rr);
      g.addColorStop(.1, `rgba(${cc},${a})`); g.addColorStop(1, `rgba(${cc},${a * (1 - .75 * t)})`);
      x.globalAlpha = 1; x.fillStyle = g; x.beginPath(); x.arc(sp.x, sp.y, rr, 0, 7); x.fill();
      if (t < .6 && lightSky){ x.globalAlpha = a * (1 - t / .6) * .9; const b = glow('255,255,250', 64); x.drawImage(b, sp.x - rr * 2.2, sp.y - rr * 2.2, rr * 4.4, rr * 4.4); }
    }
    // the skyline, fading as the haze thickens
    if (city){ x.save(); x.translate(0, H); x.globalAlpha = (1 - .9 * t) * .55 * ease; x.fillStyle = mix(s.bot, lightSky ? '#3A4654' : '#05070A', .45); x.fill(city); x.restore(); }
    // haze banks drifting low across the sky, veiling the sun
    for (const b of K.banks){ b.x += (.003 + .008 * b.z) * dt; if (b.x - b.w > W) b.x = -b.w; }
    const ba = Math.min(1, t * 1.5) * .5 * ease;
    if (ba > .01){ const hz = glow(rgb(q8(mix(s.bot, day > .5 ? '#BFA27E' : '#6A4A34', .4))), 128);
      for (const b of K.banks){ const w = b.w * 1.7, h = w * .22; x.globalAlpha = ba * (.4 + .6 * b.z); x.drawImage(hz, b.x - w / 2, b.y - h / 2, w, h); } }
    // clouds: a few fair-weather puffs in clear air, more when partly cloudy; a lid of grey under rain
    const ca = (cloud ? 1 : Math.max(0, 1 - t * 1.8) * .85) * ease, nc = {fair:3, partly:5, cloudy:6}[wx] || 7;
    if (ca > .01){
      const lit = q8(cloud > .5 ? mix(s.top, mix('#2E343C', '#9AA3AD', day), .7) : mix(s.bot, mix(mix('#B09080', s.top, .6), mix('#FFFFFF', core, gold * .5), day), lightSky ? .85 : .3));
      const shade = q8(cloud > .5 ? mix(s.top, mix('#1E2228', '#5B636D', day), .7) : mix(s.top, mix(s.bot, '#7F8FA3', .45), lightSky ? .8 : .25));
      const pf = puff(lit, shade);
      K.banks.slice(0, nc).forEach((b, i) => { const w = b.w * (cloud ? 1.1 : .55 + .25 * b.z), h = w * .47, y = cloud ? H * (.05 + i * .1) : b.y;
        x.globalAlpha = ca * (.6 + .4 * b.z); x.drawImage(pf, b.x - w / 2, y - h / 2, w, h); });
    }
    // motes of haze, lit up where they cross the sun
    const md = glow(lightSky ? (t > .3 ? '108,86,60' : '255,255,255') : '255,226,190'), ld = glow(cc), ma = (lightSky && t <= .3 ? .55 : 1) * ease * (wet ? .4 : 1);
    for (const p of K.motes){
      p.x += (.006 + .022 * p.z) * dt; p.y += Math.sin(now * .0005 + p.ph) * .012 * p.z * dt;
      if (p.x > W + 4) p.x = -4; if (p.y < -4) p.y = H + 4; else if (p.y > H + 4) p.y = -4;
      const r = (.5 + 1.6 * p.z) * (1 + .3 * t), a = (.1 + .26 * p.z) * ma;
      x.globalAlpha = a; x.drawImage(md, p.x - r * 2, p.y - r * 2, r * 4, r * 4);
      if (sun.alt > -2){ const dx = p.x - sp.x, dy = p.y - sp.y, lit = Math.exp(-(dx * dx + dy * dy) / (R * R * 30)) * veil;
        if (lit > .05){ x.globalAlpha = Math.min(1, a * lit * 1.8); x.drawImage(ld, p.x - r * 3, p.y - r * 3, r * 6, r * 6); } }
    }
    // rain, and in a storm the odd flash of lightning
    if (wet){ x.strokeStyle = lightSky ? '#FFFFFF' : '#BECDE1'; x.lineCap = 'round';
      for (const d of K.drops){ const v = .55 + .5 * d.z; d.y += v * dt; d.x -= .12 * v * dt;
        if (d.y > H + 20){ d.y = -20; d.x = rand() * (W + 40); } if (d.x < -20) d.x += W + 40;
        const len = 10 + 14 * d.z; x.globalAlpha = (.14 + .24 * d.z) * ease; x.lineWidth = .6 + .8 * d.z;
        x.beginPath(); x.moveTo(d.x, d.y); x.lineTo(d.x + .12 * len, d.y - len); x.stroke(); } }
    if (wx === 'storm' && !still){ bolt -= dt; if (bolt < 0){ flash = 1; bolt = 5000 + rand() * 9000; }
      if (flash > 0){ x.globalAlpha = .45 * (flash > .75 ? 1 : flash > .55 ? .15 : flash); x.fillStyle = '#EEF2FF'; x.fillRect(0, 0, W, H); flash -= dt / 650; } }
    x.globalAlpha = 1;
    if (S.tab !== 'now') return;
    if (still) skyWait = setTimeout(() => { skyRaf = requestAnimationFrame(frame); }, 60e3);   // no motion: repaint once a minute as the light changes
    else skyRaf = requestAnimationFrame(frame);
  };
  frame(last);
}

/* ---------- Links to the official source ---------- */
const OFFICIAL = 'https://www.haze.gov.sg/', NEA_GUIDE = 'https://www.haze.gov.sg/docs/default-source/posters/haze-pm-psi-guide-a4-english.pdf';
const ext = (href, text) => `<a class="ext" href="${href}" target="_blank" rel="noopener" data-track="out/${new URL(href).hostname}">${text}${ICON.out}</a>`;
const officialLine = () => `<p class="official">${t('official', {link:ext(OFFICIAL, 'haze.gov.sg')})}</p>`;

/* ---------- Now ---------- */
const psiStart = k => k === 0 ? 0 : PSI[k-1].max + 1;
function psiRange(lo, hi){ const a = psiStart(lo), b = PSI[hi].max; return b === Infinity ? `${a}+` : `${a}–${b}`; }
/* A bar drawn by band: a small marker for the reading, and a bracket under the forecast bands, labelled Forecast.
   No band labels: the number, the band word and the colours above it already say what they would. */
const bandLo = (B, k) => k === 0 ? 0 : B[k-1].max + 1;
const bandHi = (B, k) => B[k].max === Infinity ? (B === PM ? 350 : 400) : B[k].max;
function lbar({B, v, fc, tick}){
  const N = B.length, k = B.findIndex(x => v <= x.max), lo = bandLo(B, k), hi = bandHi(B, k);
  const at = (k + Math.max(0, Math.min(1, (v - lo) / (hi - lo)))) / N, on = i => fc ? i >= fc.lo && i <= fc.hi : i === k;
  // the label sits under the bracket's middle, or against its outer end at either edge of the bar
  const fcl = fc && (fc.lo === 0 ? 'left:0' : fc.hi === N - 1 ? 'right:0' : `left:${((fc.lo + fc.hi + 1) / 2 / N * 100).toFixed(1)}%;transform:translateX(-50%)`);
  return `<div class="lb" style="--tick:${tick}" aria-hidden="true"><span class="tick" style="left:${(Math.max(.03, Math.min(.97, at)) * 100).toFixed(1)}%"></span>
    <div class="track" style="grid-template-columns:repeat(${N},1fr)">${B.map((x, i) => `<i style="background:var(--c${x.c});opacity:${on(i) ? 1 : .3}"></i>`).join('')}</div>
    ${fc ? `<div class="br"><span style="left:${fc.lo / N * 100}%;width:${(fc.hi - fc.lo + 1) / N * 100}%"></span><b class="fcl" style="${fcl}">${t('now.forecast')}</b></div>` : ''}</div>`;
}
function renderNow(){
  const el = document.getElementById('v-now'), n = now(P.region), f = S.d.fc, r = fcRel(), plan = f ? PSI[f.hi] : n.p;
  el.innerHTML = `
    <div class="sky">
      <div class="eb">${t('now.eb')}</div>
      <div class="big" style="background:var(--c${n.b.c});color:var(--on${n.b.c})">${n.b.name}</div>
      <button class="lnum" data-act="def" data-k="pm" aria-label="${esc(t('aria.pmdef', {v:n.pm}))}"><span class="v num">${n.pm}</span><span class="k"><b>${t('now.at', {time:sgHour(S.d.asOf)})}</b><small>PM2.5 · µg/m³</small></span></button>
      ${trendLine(P.region)}
      <div class="lbw">${lbar({B:PM, v:n.pm, tick:'var(--sky-ink)'})}</div>
      <div class="advw"><button class="adv" data-act="nea" data-k="pm" aria-expanded="false">${esc(pmShort(n.b))}</button>
        <div class="nea" id="nea-pm" hidden>${esc(t('nea.prefix', {text:pmAdvice(n.b)}))}</div></div>
      ${installBanner()}
    </div>
    <div class="ahead">
      <div class="eb" style="color:var(--muted)">${t(r === 1 ? 'tomorrow' : 'today')}</div>
      <div class="head2" style="color:var(--fg${plan.c})">${f ? (f.lo === f.hi ? PSI[f.lo].name : `${PSI[f.lo].name} → ${PSI[f.hi].name}`) : n.p.name}</div>
      <div class="lpair">
        <button data-act="def" data-k="psi" aria-label="${esc(t('aria.psidef', {v:n.psi}))}"><span class="v num" style="color:var(--fg${n.p.c})">${n.psi}</span><span class="k"><b>${t('now.past24')}</b><small>PSI</small></span></button>
        <button data-act="def" data-k="fc" aria-label="${esc(t('aria.fcdef'))}"><span class="v num" style="color:${f ? `var(--fg${PSI[f.hi].c})` : 'var(--muted)'}${f ? '' : ';font-size:30px'}">${f ? psiRange(f.lo, f.hi) : t('now.none')}</span><span class="k"><b>${t('now.forecast')}</b><small>PSI</small></span></button>
      </div>
      ${lbar({B:PSI, v:n.psi, fc:f, tick:'var(--ink)'})}
      <div><button class="adv plan" data-act="nea" data-k="psi" aria-expanded="false">${esc(psiShort(plan))}</button>
        <div class="nea" id="nea-psi" hidden>${esc(t('nea.prefix', {text:psiAdvice(plan)}))}${f && f.lo !== f.hi ? esc(t('nea.upper', {band:PSI[f.hi].name})) : f ? '' : esc(t('nea.nofc'))}</div></div>
      ${shareBlock()}
      <div class="lfoot">${whoPicker()} <span class="nw">· ${t('foot.source')} ${ext(OFFICIAL, 'haze.gov.sg')}</span></div>
      <div class="langs" role="group" aria-label="${t('set.lang')}">${LANGS.map(([k, nm]) => `<button data-lang="${k}" aria-pressed="${k === P.lang}" lang="${k}">${k === 'ms' ? 'Melayu' : nm}</button>`).join('')}</div>
    </div>`;
  // phones: haze drifts across the sky panel; wide screens: the sky is the whole page, so it drifts across all of it
  paintSky(matchMedia('(min-width:960px)').matches ? el : el.querySelector('.sky'), n.pm);
}
/* who the advice is for: reads as a line of text, and opens the phone's own picker */
const whoPicker = () => `<label class="whosel">${esc(t('for.line', {who:G().plural}))}${ICON.down}<select data-pick="group">${GROUPS.map(g =>
  `<option value="${g.id}"${g.id === P.group ? ' selected' : ''}>${esc(t('for.line', {who:g.plural}))}</option>`).join('')}</select></label>`;
/* Which way the haze is heading. The 24-hr PSI lags by design, so compare this hour's PM2.5 with three hours ago;
   small changes (under 10 µg/m³ or 15%) count as steady. */
function pmTrend(r){
  const R = S.d.regions[r], i = S.d.li, j = i - 3;
  if (j < 0 || R.pm[j] == null || R.pm[i] == null) return null;
  const a = R.pm[j], b = R.pm[i], d = b - a;
  return {dir: Math.abs(d) < 10 || Math.abs(d) / Math.max(a, 1) < .15 ? 0 : d > 0 ? 1 : -1, from:a, to:b, since:S.d.times[j]};
}
function trendLine(r){
  const tr = pmTrend(r); if (!tr) return '';
  const word = t(['trend.clear', 'trend.steady', 'trend.worse'][tr.dir + 1]);
  return `<div class="trend num"><b class="${['down', 'flat', 'up'][tr.dir + 1]}">${word}</b> <span>${esc(t('trend.since', {from:tr.from, to:tr.to, time:sgHour(tr.since)}))}</span></div>`;
}
/* what each number means, shown when it is tapped */
function defText(k){
  const n = now(P.region), f = S.d.fc;
  if (k === 'pm') return `<b>${esc(t('def.pm.title', {v:n.pm}))}</b>${esc(t('def.pm.body', {n:n.b.n, band:n.b.name, range:n.b.range}))}`;
  if (k === 'psi') return `<b>${esc(t('def.psi.title', {v:n.psi}))}</b>${esc(t('def.psi.body', {band:n.p.name, range:n.p.range}))}`;
  return f ? `<b>${esc(t('def.fc.title', {range:psiRange(f.lo, f.hi)}))}</b>${esc(t('def.fc.body', {when:fcFor(), name:fcName()}))}${/\b(low|mid|high|upper|lower)\b/i.test(f.text) ? `<br><span lang="en">NEA: “${esc(f.text)}”</span>` : ''}`
           : `<b>${esc(t('def.nofc.title'))}</b>${esc(t('def.nofc.body'))}`;
}
const pop = () => document.getElementById('pop');
function showDef(k){
  const el = pop(), same = !el.hidden && el.dataset.k === k;
  el.dataset.k = k; el.hidden = same;
  el.innerHTML = `${defText(k)}<button class="link" data-act="explain" style="display:flex;margin-top:8px;font-size:13px">${t('def.more')} ${ICON.right}</button>`;
}

/* ---------- My day ---------- */
function step(when, sub, advice, c, why, V){
  return `<div class="step"><span class="mk" style="background:var(--c${c});color:var(--on${c})">${ICON[V.i]}</span>
    <div><div class="when">${when} <span>${sub}</span></div><div class="v">${V.w}</div><div class="a">${esc(advice)}</div><div class="why num">${why}</div></div></div>`;
}
function renderDay(){
  const el = document.getElementById('v-day'), n = now(P.region), f = S.d.fc, rel = fcRel();
  const todayB = f && rel === 0 ? PSI[f.hi] : n.p;   // forecast if it covers today, else the current reading
  const steps = [
    step(t('day.next'), t('day.from', {time:sgHour(S.d.asOf)}), pmAdvice(n.b), n.b.c, `${badge(n.b.c, t('band.label', {n:n.b.n, name:n.b.name}))} ${esc(t('why.pm', {v:n.pm}))}`, pmVerdict(n.b)),
    step(t('day.rest'), `· ${sgDay(S.d.asOf, true)}`, psiAdvice(todayB), todayB.c, f && rel === 0 ? `${fcBadges()} ${t('why.fc')}` : `${badge(n.p.c, n.p.name)} ${esc(t('why.psi', {v:n.psi}))}`, psiVerdict(todayB))];
  if (f && rel === 1) steps.push(step(t('day.tomorrow'), `· ${sgDay(f.date, true)}`, psiAdvice(PSI[f.hi]), PSI[f.hi].c, `${fcBadges()} ${t('why.fc')}`, psiVerdict(PSI[f.hi])));
  else steps.push(`<div class="step"><span class="mk" style="background:var(--surface-2);color:var(--muted);border:1px dashed var(--line)">${ICON.light}</span>
      <div><div class="when">${t('day.tomorrow')} <span>· ${sgDay(new Date(S.d.asOf.getTime() + 86400e3), true)}</span></div><div class="v" style="color:var(--muted)">${t('day.notyet')}</div>
      <div class="a" style="color:var(--muted)">${t('day.notyetBody')}</div></div></div>`);
  const worst = Math.max(pmVerdict(n.b).k, psiVerdict(todayB).k);
  const head = t('day.head.' + worst);
  el.innerHTML = `<div class="day">
    <div><h2>${head}</h2><div style="margin-top:6px;color:var(--muted)">${forLine()}</div></div>
    <div class="tl">${steps.join('')}</div>
    ${S.d.statement[0] ? `<button class="news" data-act="news" lang="en"><b lang="${P.lang}">${t('news.title')}${S.d.issued ? ' · ' + sgAt(S.d.issued) : ''}</b>${esc(S.d.statement[0].replace(/^Singapore, [^–-]+[–-]\s*/, '').slice(0, 150))}… <span class="link" style="font-size:13.5px" lang="${P.lang}">${t('news.more')}</span></button>` : ''}
    ${shareBlock()}
    ${officialLine()}
  </div>`;
}

/* ---------- History: fixed axes, every band visible, tap or drag to read any hour ---------- */
const HG = {W:340, H:200, pl:28, pr:8, pt:6, pb:22};
const hx = (i, n) => HG.pl + (HG.W - HG.pl - HG.pr) * i / (n - 1);
const hy = (v, top) => HG.pt + (HG.H - HG.pt - HG.pb) * (1 - Math.min(v, top) / top);
const SERIES = () => { const R = S.d.regions[P.region], n = S.d.li + 1;
  return [{key:'pm', vals:R.pm.slice(0, n), bands:PM, top:300, unit:'µg/m³', band:v => PM[pmIdx(v)], lab:b => t('band.label', {n:b.n, name:b.name})},
          {key:'psi', vals:R.psi.slice(0, n), bands:PSI, top:400, unit:'PSI', band:v => PSI[psiIdx(v)], lab:b => b.name}]; };
function chart(s, title){
  const {W, H, pl, pr, pb} = HG, n = s.vals.length;
  let lo = 0, g = '';
  for (const b of s.bands){
    const hi = Math.min(b.max, s.top), y0 = hy(lo, s.top), y1 = hy(hi, s.top);
    g += `<rect x="${pl}" y="${y1}" width="${W-pl-pr}" height="${y0-y1}" fill="var(--tn${b.c})"/><rect x="${pl}" y="${y1}" width="3" height="${y0-y1}" fill="var(--c${b.c})"/>`;
    g += `<text class="bl" x="${W-pr-6}" y="${(y0+y1)/2+3.5}" text-anchor="end" style="fill:var(--fg${b.c})">${esc(s.key === 'pm' ? `${b.n} · ${b.name}` : b.name)}</text>`;
    if (b.max < s.top) g += `<text x="${pl-5}" y="${y1+3.5}" text-anchor="end">${b.max}</text>`;
    lo = hi;
  }
  const pts = s.vals.map((v, i) => v == null ? null : [hx(i, n), hy(v, s.top), v]).filter(Boolean);
  const dots = pts.map(p => `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="2.6" fill="var(--c${s.band(p[2]).c})" stroke="var(--ink)" stroke-width=".8"/>`).join('');
  const xl = [0, 6, 12, 18, n-1].map(i => `<text x="${hx(i, n)}" y="${H-6}" text-anchor="${i === 0 ? 'start' : i === n-1 ? 'end' : 'middle'}">${i === n-1 ? t('hist.axisNow') : sgHour(S.d.times[i])}</text>`).join('');
  return `<svg class="chart" data-chart="${s.key}" viewBox="0 0 ${W} ${H}" tabindex="0" role="img" aria-label="${esc(title + '. ' + t('hist.hint'))}">${g}<text x="${pl-5}" y="${hy(0, s.top)+3.5}" text-anchor="end">0</text>
    <path d="${pts.map((p, i) => (i ? 'L' : 'M') + p[0].toFixed(1) + ' ' + p[1].toFixed(1)).join(' ')}" fill="none" stroke="var(--ink)" stroke-width="1.8" stroke-linejoin="round"/>${dots}${xl}<g class="cross"></g></svg>`;
}
function drawSel(){
  const i = S.hi, at = S.d.times[i], when = `${i === S.d.li ? t('hist.nowPrefix') : ''}${sgAt(at, true)}`;
  for (const s of SERIES()){
    const svg = document.querySelector(`[data-chart="${s.key}"]`), ro = document.getElementById('ro-' + s.key);
    if (!svg || !ro) continue;
    const v = s.vals[i], X = hx(i, s.vals.length);
    svg.querySelector('.cross').innerHTML = `<line x1="${X}" x2="${X}" y1="${HG.pt}" y2="${HG.H-HG.pb}" stroke="var(--ink)" stroke-width="1.2" stroke-dasharray="3 3"/>`
      + (v == null ? '' : `<circle cx="${X}" cy="${hy(v, s.top)}" r="6.5" fill="var(--c${s.band(v).c})" stroke="var(--ink)" stroke-width="2.5"/>`);
    ro.innerHTML = v == null ? `<span class="rn">–</span><span class="rt">${esc(t('hist.noReading', {when}))}</span>`
      : `<span class="rn" style="color:var(--fg${s.band(v).c})">${v}</span><span class="rd"><span>${s.unit} ${badge(s.band(v).c, s.lab(s.band(v)))}</span><span class="rt">${when}</span></span>`;
  }
}
function pickHour(e){
  const svg = e.target.closest && e.target.closest('svg[data-chart]'); if (!svg) return;
  const r = svg.getBoundingClientRect(), vx = (e.clientX - r.left) / r.width * HG.W, n = S.d.li + 1;
  const i = Math.max(0, Math.min(n - 1, Math.round((vx - HG.pl) / (HG.W - HG.pl - HG.pr) * (n - 1))));
  if (i !== S.hi){ S.hi = i; drawSel(); }
}
function renderHist(){
  const el = document.getElementById('v-hist'), li = S.d.li, [pm, psi] = SERIES();

async function geolocate(){
  const btn = document.getElementById('geo'), say = t => { const m = document.getElementById('geomsg'); if (m) m.textContent = t; };
  if (!('geolocation' in navigator)){ track('location/unsupported'); return say(t('geo.unsupported')); }
  if (!window.isSecureContext){ track('location/insecure'); return say(t('geo.insecure')); }
  let state = null;
  try { state = (await navigator.permissions.query({name:'geolocation'})).state; } catch(e) {}
  if (state === 'denied'){ track('location/blocked'); return say(t('geo.blocked')); }

  navigator.geolocation.getCurrentPosition(pos => {
    if (btn) btn.disabled = false;
    const {latitude:la, longitude:lo} = pos.coords;
    if (la < 1.15 || la > 1.48 || lo < 103.6 || lo > 104.1){ track('location/outside-singapore'); return say(t('geo.outside')); }
    const a = nearestArea(la, lo);
    track('location/found/' + a[1]);

    if (btn) btn.disabled = false;
    track('location/' + (err.code === 1 ? 'denied' : err.code === 3 ? 'timeout' : 'unavailable'));
    say(err.code === 1 ? t('geo.denied')
      : err.code === 3 ? t('geo.timeout')
      : t('geo.unavailable'));
  }, {enableHighAccuracy:false, timeout:15000, maximumAge:10 * 60e3});
}

/* The picture card is made as soon as a screen shows, so a tap can share it at once: phones only allow sharing
   straight after a tap. Phones share it through their share menu (pick WhatsApp there); computers copy it, ready to
   paste into WhatsApp Web; anything else shows it to save. */
const CAN_SHARE_FILES = (() => { try { return !!(navigator.canShare && navigator.canShare({files:[new File([new Blob(['x'])], 'h.png', {type:'image/png'})]})); } catch(e) { return false; } })();
const CAN_COPY_IMG = !!(window.ClipboardItem && navigator.clipboard && navigator.clipboard.write);
let cardCache = {key:null, blob:null, url:null}, cardPending = null, cardPendingKey = null;
const cardKey = () => S.d ? P.region + '|' + P.lang + '|' + atStamp(S.d.asOf) : null;
function ensureCard(){
  const k = cardKey();
  if (!k) return Promise.reject(new Error('no data'));
  if (cardCache.key === k) return Promise.resolve(cardCache.blob);
  if (cardPendingKey === k) return cardPending;
  cardPendingKey = k;
  cardPending = cardBlob().then(blob => {
    if (cardCache.url) URL.revokeObjectURL(cardCache.url);
    cardCache = {key:k, blob, url:URL.createObjectURL(blob)};
    paintThumbs();
    return blob;
  }).finally(() => { if (cardPendingKey === k){ cardPendingKey = null; cardPending = null; } });
  return cardPending;
}
function paintThumbs(){
  if (cardCache.key !== cardKey()) return;
  document.querySelectorAll('.thumb').forEach(el => { el.style.backgroundImage = `url(${cardCache.url})`; el.classList.add('ready'); });
}
const pictureName = () => `haze-${P.region}-${sgDayEN(S.d.asOf).replace(' ', '-').toLowerCase()}.png`;
function showPicture(blob){
  if (!sheet.classList.contains('on')) openShare();
  const out = document.getElementById('imgOut'); if (!out) return;
  const u = URL.createObjectURL(blob);
  out.hidden = false;
  out.innerHTML = `<img src="${u}" alt="${esc(t('pic.alt', {region:RNAME[P.region], band:now(P.region).b.name}))}"><a class="plain" href="${u}" download="${pictureName()}">${t('pic.save')}</a><p class="msg" style="margin:0">${t('pic.hold')}</p>`;
  out.scrollIntoView({behavior:'smooth', block:'nearest'});
}
async function sharePicture(btn){
  const lbl = btn.querySelector('.lbl'), was = lbl ? lbl.textContent : '', say = (m, ms) => { if (!lbl) return; lbl.textContent = m; if (ms) setTimeout(() => { lbl.textContent = was; }, ms); };
  let blob = cardCache.key === cardKey() ? cardCache.blob : null;
  if (!blob){ say(t('pic.preparing')); try { blob = await ensureCard(); } catch(e) { return say(was); } say(was); }
  if (CAN_SHARE_FILES){
    try { await navigator.share({files:[new File([blob], pictureName(), {type:'image/png'})], text:shareText()}); track('share/picture/shared'); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  if (CAN_COPY_IMG){
    try { await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]); track('share/picture/copied'); return say(t('pic.copied'), 2800); }
    catch(e) {}
  }
  track('share/picture/shown');

}
const picLabel = () => t(CAN_SHARE_FILES ? 'pic.share' : CAN_COPY_IMG ? 'pic.copy' : 'pic.save');
/* Share on WhatsApp sends the picture card itself, never text. No web page can drop a picture straight into WhatsApp
   (its links carry text only): phones open the share menu with the picture attached, where WhatsApp is one tap;
   computers copy the picture and open WhatsApp Web to paste it, because the Mac share menu has no WhatsApp in it;
   anything else shows it to save. The picture goes alone, because WhatsApp on iPhones drops a picture that comes
   with text, and the card already carries the address and a QR code. */
async function shareWhatsApp(btn){
  const lbl = btn.querySelector('.lbl'), was = lbl.textContent, say = (m, ms) => { lbl.textContent = m; if (ms) setTimeout(() => { lbl.textContent = was; }, ms); };
  const phone = matchMedia('(pointer:coarse)').matches;
  let blob = cardCache.key === cardKey() ? cardCache.blob : null;
  if (!blob){ say(t('pic.preparing')); try { blob = await ensureCard(); } catch(e) { return say(was); } say(was); }
  if (phone && CAN_SHARE_FILES){
    try { await navigator.share({files:[new File([blob], pictureName(), {type:'image/png'})]}); track('share/whatsapp/shared'); return; }
    catch(e){ if (e.name === 'AbortError') return; }
  }
  if (!phone && CAN_COPY_IMG){
    try {
      await navigator.clipboard.write([new ClipboardItem({'image/png': blob})]);
      track('share/whatsapp/copied'); say(t('pic.copied'), 4000);
      window.open('https://web.whatsapp.com/', '_blank', 'noopener');
      return;
    } catch(e) {}
  }
  track('share/whatsapp/shown');
  showPicture(blob);
}

/* Longer languages (Tamil, Malay) can outgrow the big type: shrink a number or band word until it fits its box,
   and keep the forecast headline to two lines */
function fitAll(){
  const v = document.getElementById('v-' + S.tab); if (!v) return;
  v.querySelectorAll('.big, .lnum .v, .lpair .v').forEach(el => {
    el.style.fontSize = '';
    const box = el.closest('.lpair > button') || el.parentElement;
    let s = parseFloat(getComputedStyle(el).fontSize);
    while (el.scrollWidth > box.clientWidth + 1 && s > 22){ s -= 2; el.style.fontSize = s + 'px'; }
  });
  for (const [sel, lines] of [['.head2', 2], ['.day h2', 3]]) v.querySelectorAll(sel).forEach(el => {
    el.style.fontSize = '';
    let s = parseFloat(getComputedStyle(el).fontSize);
    const lh = () => parseFloat(getComputedStyle(el).lineHeight) || s * 1.1;
    while (el.offsetHeight > lh() * lines + 2 && s > 16){ s -= 1; el.style.fontSize = s + 'px'; }
  });
}

/* ---------- Analytics: GoatCounter (no cookies). Counts visits and taps, and how a visit arrived (shared link, QR

   copies and previews are not counted. A browser can opt out with localStorage.setItem('skipgc', 't'). ---------- */
let gcQueue = [];

  if (ids[b.id]) return track(ids[b.id]);
  if (a === 'share') return track('share/open/' + where);
  if (a === 'wa') return track('share/whatsapp-button/' + where);
  if (a === 'install') return track('install/asked/' + where);
  if (a === 'install-dismiss') return track('install/dismissed');
  if (a === 'def') return track('define/' + b.dataset.k);
  if (a === 'nea') return track('nea-wording/' + b.dataset.k);
  if (a === 'explain' || a === 'news' || a === 'region') return track('open/' + a);
  if (b.dataset.tab && b.dataset.tab !== S.tab) return track('tab/' + b.dataset.tab);
  if (b.dataset.region) return track('region/' + b.dataset.region);

}

}
